# ════════════════════════════════════════════════════════════════════════════
# EINMAL-WORKFLOW – nach erfolgreicher Ausfuehrung wieder entfernen, zusammen mit
#   backend/scripts/entferne-vor-vertragsbeginn.js
#   backend/tests/entferne-vor-vertragsbeginn.test.js
# ════════════════════════════════════════════════════════════════════════════
#
# Entfernt Verkaufszeilen eines Partners mit Bestelldatum vor Vertrag-ab.
# Standard ist der Trockenlauf. Geloescht wird nur mit "loeschen" UND passenden
# erwarteten Werten (Zeilen + Summe) - sonst Abbruch ohne Schreiben.
#
# Laeuft nur von Hand (workflow_dispatch), nie per Zeitplan.

name: Einmal – Zeilen vor Vertrag-ab entfernen

on:
  workflow_dispatch:
    inputs:
      partner:
        description: 'Partner-ID'
        required: true
        default: 'P-004'
        type: string
      shop:
        description: 'Shop'
        required: true
        default: 'honk'
        type: choice
        options: [honk, jfn]
      loeschen:
        description: 'Wirklich löschen (aus = Trockenlauf)'
        required: true
        default: false
        type: boolean
      erwartete_zeilen:
        description: 'Erwartete Zeilenzahl (Pflicht beim Löschen)'
        required: false
        default: ''
        type: string
      erwartete_summe:
        description: 'Erwartete Summe Lizenzgebühr, z.B. 192,61 (Pflicht beim Löschen)'
        required: false
        default: ''
        type: string

# Nie zwei Laeufe gleichzeitig - der zweite wuerde auf verschobenen Zeilen arbeiten.
concurrency:
  group: entferne-vor-vertragsbeginn
  cancel-in-progress: false

jobs:
  entfernen:
    name: Zeilen vor Vertrag-ab (${{ inputs.loeschen && 'LÖSCHEN' || 'Trockenlauf' }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
        working-directory: backend

      # Eingaben nur ueber Env-Variablen ins Skript, nie direkt in den Shell-Text.
      # Credentials als Env (getGoogleAuth liest GOOGLE_CREDENTIALS_JSON), es wird
      # keine Schluesseldatei geschrieben.
      - name: Skript ausführen
        env:
          BUSINESS_SHEET_ID:       ${{ secrets.BUSINESS_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          IN_PARTNER:  ${{ inputs.partner }}
          IN_SHOP:     ${{ inputs.shop }}
          IN_LOESCHEN: ${{ inputs.loeschen }}
          IN_ZEILEN:   ${{ inputs.erwartete_zeilen }}
          IN_SUMME:    ${{ inputs.erwartete_summe }}
        run: |
          args=(--partner="$IN_PARTNER" --shop="$IN_SHOP" --erwartete-zeilen="$IN_ZEILEN" --erwartete-summe="$IN_SUMME")
          if [ "$IN_LOESCHEN" = "true" ]; then args+=(--loeschen); fi
          node backend/scripts/entferne-vor-vertragsbeginn.js "${args[@]}"
