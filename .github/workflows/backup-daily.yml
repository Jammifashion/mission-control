name: Daily Backup

on:
  schedule:
    # 02:00 UTC, eine Stunde vor dem Partner-Sync (sync-partner-daily.yml,
    # 03:00 UTC). Liefen beide zur selben Minute, sicherte das Backup einen
    # Stand, in den der Sync gerade Verkaufszeilen und Storno-Gegenbuchungen
    # schrieb - also genau dann unbrauchbar, wenn man es braucht.
    - cron: '0 2 * * *'   # täglich 02:00 UTC = 03:00/04:00 deutscher Zeit
  workflow_dispatch:        # manueller Trigger über GitHub UI

jobs:
  backup:
    name: Backup Google Sheets → Drive
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      # BUSINESS_SHEET_ID muss mit durchgereicht werden, sonst bricht der Lauf
      # ab (Befund B18): das Skript verlangt beide Spreadsheet-IDs und schreibt
      # ohne die zweite gar kein Backup mehr, statt still nur das SSOT zu sichern.
      - name: Run backup
        env:
          GOOGLE_SHEET_ID:                ${{ secrets.GOOGLE_SHEET_ID }}
          BUSINESS_SHEET_ID:              ${{ secrets.BUSINESS_SHEET_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID:   ${{ secrets.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID:  ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
          GOOGLE_DRIVE_BACKUP_DAILY_ID:   ${{ secrets.GOOGLE_DRIVE_BACKUP_DAILY_ID }}
          GOOGLE_DRIVE_BACKUP_MONTHLY_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_MONTHLY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
        run: node backend/scripts/backup-daily.js
