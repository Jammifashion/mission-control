name: Daily Backup

on:
  schedule:
    # 02:00 UTC, eine Stunde vor dem Partner-Sync (sync-partner-daily.yml,
    # 03:00 UTC). Liefen beide zur selben Minute, sicherte das Backup einen
    # Stand, in den der Sync gerade Verkaufszeilen und Storno-Gegenbuchungen
    # schrieb - also genau dann unbrauchbar, wenn man es braucht.
    - cron: '0 2 * * *'   # täglich 02:00 UTC = 03:00/04:00 deutscher Zeit
  workflow_dispatch:        # manueller Trigger über GitHub UI

# Das Backup laeuft im Backend (Cloud Run, eigenes Dienstkonto). Der Workflow
# stoesst es nur an. Bis 2026-09-15 lief es hier mit GOOGLE_CREDENTIALS_JSON -
# jenes Dienstkonto hat keinen Zugriff mehr auf die geteilte Ablage.
jobs:
  backup:
    name: Trigger Backup (POST /api/backup/manual)
    runs-on: ubuntu-latest

    steps:
      # Kaltstart abfangen: Cloud Run faehrt die Instanz nach Leerlauf herunter; der erste
      # Aufruf kann waehrenddessen mit 500 scheitern (sync-partner-daily, Lauf #142, 30.09.).
      # GET /health ist offen und harmlos und darf wiederholt werden, der POST danach bleibt
      # ein einziger Versuch (kein --retry). Kommt binnen 60 s kein 200, bricht der Lauf ab.
      - name: Backend aufwecken (GET /health)
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ]; then
            echo "::error::BACKEND_URL fehlt in GitHub Secrets."
            exit 1
          fi
          start=$SECONDS
          http="000"
          while :; do
            http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$API_URL/health" || true)
            echo "GET /health -> HTTP ${http:-000} (nach $((SECONDS - start)) s)"
            [ "$http" = "200" ] && exit 0
            [ $((SECONDS - start)) -ge 60 ] && break
            sleep 5
          done
          echo "::error::Backend antwortet nicht mit HTTP 200 auf GET /health (60 s, zuletzt HTTP ${http:-000})."
          exit 1

      # Fehlerausgabe (oeffentliches Actions-Log): HTTP-Code plus Fehlertext, maskiert und auf
      # 300 Zeichen gekuerzt (.github/scripts/antwort-fehler.mjs, Test antwort-fehler.test.js).
      - name: Hilfsskript holen
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: POST /api/backup/manual
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.MC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::BACKEND_URL oder MC_API_KEY fehlt in GitHub Secrets."
            exit 1
          fi

          rc=0
          http=$(curl -sS --fail-with-body --max-time 300 -X POST \
            -H "X-API-Key: $API_KEY" \
            -o response.json -w '%{http_code}' \
            "$API_URL/api/backup/manual") || rc=$?

          echo "HTTP ${http:-?}"

          # Das Log ist oeffentlich: nur freigegebene Felder ausgeben, nie die
          # ganze Antwort (sie enthaelt fileId, spreadsheetId, sheetName).
          if jq -e . response.json >/dev/null 2>&1; then
            jq 'if .error then {error}
                else {
                  backups: [(.backups // [])[] | {fileName, sizeKB, tabCount}],
                  aufgeraeumt: {
                    daily:   (.aufgeraeumt.daily   // 0 | tonumber),
                    monthly: (.aufgeraeumt.monthly // 0 | tonumber)
                  },
                  cleanupWarnungen: (.cleanupWarnungen // [])
                } end' response.json
            jq -r '(.cleanupWarnungen // [])[] | "::warning::Cleanup: " + .' response.json
          else
            echo "(Antwort ist kein JSON - nicht ausgegeben)"
          fi

          if [ "$rc" -ne 0 ]; then
            node .github/scripts/antwort-fehler.mjs response.json "${http:-?}" || true
            echo "::error::Backup fehlgeschlagen (HTTP ${http:-?}, curl exit $rc)"
            exit 1
          fi
