name: Trikot-Sync täglich

on:
  # 05:00 UTC liegt hinter Backup (02:00) und Partner-Sync (03:00).
  # Ein Schedule-Lauf hat keine Inputs: after leer, dry_run leer → echter Lauf.
  schedule:
    - cron: '0 5 * * *'   # täglich 05:00 UTC = 07:00 Sommer / 06:00 Winter Berlin
  workflow_dispatch:
    inputs:
      after:
        description: 'Startdatum YYYY-MM-DD (leer = jüngstes Bestelldatum im Reiter)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run – nichts ins Sheet schreiben'
        type: boolean
        required: false
        default: true

jobs:
  sync:
    name: Trigger Trikot-Sync (POST /api/trikot/sync)
    runs-on: ubuntu-latest

    steps:
      # Kaltstart abfangen: Cloud Run faehrt die Instanz nach Leerlauf herunter; der erste
      # Aufruf kann waehrenddessen mit 500 scheitern (sync-partner-daily, Lauf #142, 30.09.).
      # GET /health ist offen und harmlos und darf wiederholt werden, der POST danach bleibt
      # ein einziger Versuch (kein --retry). Kommt binnen 60 s kein 200, bricht der Lauf ab.
      - name: Backend aufwecken (GET /health)
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ]; then
            echo "::error::BACKEND_URL fehlt in GitHub Secrets."
            exit 1
          fi
          start=$SECONDS
          http="000"
          while :; do
            http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$API_URL/health" || true)
            echo "GET /health -> HTTP ${http:-000} (nach $((SECONDS - start)) s)"
            [ "$http" = "200" ] && exit 0
            [ $((SECONDS - start)) -ge 60 ] && break
            sleep 5
          done
          echo "::error::Backend antwortet nicht mit HTTP 200 auf GET /health (60 s, zuletzt HTTP ${http:-000})."
          exit 1

      # Fehlerausgabe (oeffentliches Actions-Log): HTTP-Code plus Fehlertext, maskiert und auf
      # 300 Zeichen gekuerzt (.github/scripts/antwort-fehler.mjs, Test antwort-fehler.test.js).
      - name: Hilfsskript holen
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: POST /api/trikot/sync
        env:
          API_URL:       ${{ secrets.BACKEND_URL }}
          API_KEY:       ${{ secrets.MC_API_KEY }}
          INPUT_AFTER:   ${{ inputs.after }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::BACKEND_URL oder MC_API_KEY fehlt in GitHub Secrets."
            exit 1
          fi

          dry=false
          if [ "$INPUT_DRY_RUN" = "true" ]; then dry=true; fi
          # jq baut das JSON, damit der after-Input nicht roh im Body landet.
          payload=$(jq -cn --arg after "$INPUT_AFTER" --argjson dryRun "$dry" \
            '{dryRun: $dryRun} + (if $after == "" then {} else {after: $after} end)')
          echo "Triggere Trikot-Sync gegen $API_URL mit $payload"

          rc=0
          http=$(curl -sS --fail-with-body --max-time 300 -X POST \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            -o response.json -w '%{http_code}' \
            "$API_URL/api/trikot/sync") || rc=$?

          echo "HTTP ${http:-?}"
          # Das Log ist oeffentlich: nur Zaehler ausgeben, nie die ganze Antwort. Fehlertext nur
          # ueber die maskierte Zeile unten (antwort-fehler.mjs). Zahlarten nur als Anzahl.
          if jq -e . response.json >/dev/null 2>&1; then
            jq 'if .error then {error: "Trikot-Sync fehlgeschlagen"}
                else {gelesen, neu, dubletten, quellen,
                      zahlarten: ((.zahlarten // {}) | length)} end' response.json
          else
            echo "(Antwort ist kein JSON - nicht ausgegeben)"
          fi

          if [ "$rc" -ne 0 ]; then
            node .github/scripts/antwort-fehler.mjs response.json "${http:-?}" || true
            echo "::error::Trikot-Sync fehlgeschlagen (HTTP ${http:-?}, curl exit $rc)"
            exit 1
          fi
