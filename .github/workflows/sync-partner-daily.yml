name: Partner Sync täglich

on:
  schedule:
    - cron: '0 3 * * *'   # täglich 03:00 UTC
  workflow_dispatch:        # manueller Trigger über GitHub UI

# Das Actions-Log ist oeffentlich: jeder Schritt gibt nur Zaehler aus (jq-Filter
# wie backup-daily.yml), nie Namen, Partner-IDs, Produkt- oder Order-IDs.

jobs:
  sync:
    name: Artikel-Abgleich, dann Partner-Sync (sync-all)
    runs-on: ubuntu-latest

    steps:
      # Kaltstart abfangen: Cloud Run faehrt die Instanz nach Leerlauf herunter; der erste
      # Aufruf kann waehrenddessen mit 500 scheitern (Lauf #142, 30.09.). GET /health ist
      # offen und harmlos und darf wiederholt werden, der POST danach bleibt ein einziger
      # Versuch (kein --retry). Kommt binnen 60 s kein 200, bricht der Lauf hier ab.
      - name: Backend aufwecken (GET /health)
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ]; then
            echo "::error::BACKEND_URL fehlt in GitHub Secrets."
            exit 1
          fi
          start=$SECONDS
          http="000"
          while :; do
            http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$API_URL/health" || true)
            echo "GET /health -> HTTP ${http:-000} (nach $((SECONDS - start)) s)"
            [ "$http" = "200" ] && exit 0
            [ $((SECONDS - start)) -ge 60 ] && break
            sleep 5
          done
          echo "::error::Backend antwortet nicht mit HTTP 200 auf GET /health (60 s, zuletzt HTTP ${http:-000}). Kein Abgleich, kein Sync."
          exit 1

      # Fehlerausgabe (oeffentliches Actions-Log): HTTP-Code plus Fehlertext, maskiert und auf
      # 300 Zeichen gekuerzt (.github/scripts/antwort-fehler.mjs, Test antwort-fehler.test.js).
      - name: Hilfsskript holen
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # PA2: ZUERST fehlende Partnerartikel anlegen. Der Sync ueberspringt
      # Positionen ohne Partner_Artikel-Zeile still und holt sie nie nach
      # (bericht-PA0/PA1). Schlaegt der Abgleich fehl, laeuft kein Sync -
      # der naechste Lauf holt den Tag nach (after = juengstes Datum).
      - name: POST /api/partner/artikel/abgleich
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.MC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::BACKEND_URL oder MC_API_KEY fehlt in GitHub Secrets."
            exit 1
          fi
          rc=0
          http=$(curl -sS --fail-with-body --max-time 300 -X POST \
            -H "x-api-key: $API_KEY" \
            -o response.json -w '%{http_code}' \
            "$API_URL/api/partner/artikel/abgleich") || rc=$?
          echo "HTTP ${http:-?}"
          if jq -e . response.json >/dev/null 2>&1; then
            jq 'if .error then {error: "Abgleich fehlgeschlagen"}
                else {summen: (.summen // {}), chat: (.chat // "")} end' response.json
            # PA6: chat = "gesendet" | "nichts zu melden" | "fehlgeschlagen" | "lebenszeichen gesendet".
            # Eine fehlgeschlagene Chat-Meldung warnt sichtbar, bricht den Sync aber nicht ab.
            if [ "$(jq -r '.chat // ""' response.json)" = "fehlgeschlagen" ]; then
              echo "::warning::Chat-Meldung des Artikel-Abgleichs fehlgeschlagen (Cloud-Run-Log [chatNotify] pruefen)."
            fi
          else
            echo "(Antwort ist kein JSON - nicht ausgegeben)"
          fi
          if [ "$rc" -ne 0 ]; then
            node .github/scripts/antwort-fehler.mjs response.json "${http:-?}" || true
            echo "::error::Artikel-Abgleich fehlgeschlagen (HTTP ${http:-?}, curl exit $rc)"
            exit 1
          fi

      - name: POST /api/partner/verkaeufe/sync-all (jfn)
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.MC_API_KEY }}
        run: |
          set -euo pipefail
          rc=0
          http=$(curl -sS --fail-with-body --max-time 300 -X POST \
            -H "x-api-key: $API_KEY" \
            -o response.json -w '%{http_code}' \
            "$API_URL/api/partner/verkaeufe/sync-all?shop=jfn") || rc=$?
          echo "HTTP ${http:-?}"
          if jq -e . response.json >/dev/null 2>&1; then
            jq 'if .error then {error: "Sync fehlgeschlagen"}
                else {partner, neueVerkaeufe: .["neueVerkäufe"], storniert, orders, gesperrt, entsperrt, nochGesperrt,
                      uebersprungen: ((.uebersprungen // []) | length),
                      fehler: ((.errors // []) | length)} end' response.json
          else
            echo "(Antwort ist kein JSON - nicht ausgegeben)"
          fi
          if [ "$rc" -ne 0 ]; then
            node .github/scripts/antwort-fehler.mjs response.json "${http:-?}" || true
            echo "::error::Sync (jfn) fehlgeschlagen mit HTTP ${http:-?}"
            exit 1
          fi

      - name: POST /api/partner/verkaeufe/sync-all (honk)
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.MC_API_KEY }}
        run: |
          set -euo pipefail
          rc=0
          http=$(curl -sS --fail-with-body --max-time 300 -X POST \
            -H "x-api-key: $API_KEY" \
            -o response.json -w '%{http_code}' \
            "$API_URL/api/partner/verkaeufe/sync-all?shop=honk") || rc=$?
          echo "HTTP ${http:-?}"
          if jq -e . response.json >/dev/null 2>&1; then
            jq 'if .error then {error: "Sync fehlgeschlagen"}
                else {partner, neueVerkaeufe: .["neueVerkäufe"], storniert, orders, gesperrt, entsperrt, nochGesperrt,
                      uebersprungen: ((.uebersprungen // []) | length),
                      fehler: ((.errors // []) | length)} end' response.json
          else
            echo "(Antwort ist kein JSON - nicht ausgegeben)"
          fi
          if [ "$rc" -ne 0 ]; then
            node .github/scripts/antwort-fehler.mjs response.json "${http:-?}" || true
            echo "::error::Sync (honk) fehlgeschlagen mit HTTP ${http:-?}"
            exit 1
          fi
