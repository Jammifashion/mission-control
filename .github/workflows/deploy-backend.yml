name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'

jobs:
  # Erst testen, dann deployen. Vorher ging jeder Push auf backend/** ungeprueft
  # nach Cloud Run, obwohl die Suite lokal vorhanden und gruen war.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/181760755456/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: mission-control-sa@mission-control-495711.iam.gserviceaccount.com
          token_format: 'access_token'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE=europe-west1-docker.pkg.dev/mission-control-495711/mission-control/backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mission-control-backend \
            --image europe-west1-docker.pkg.dev/mission-control-495711/mission-control/backend:latest \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
            --service-account mission-control-sa@mission-control-495711.iam.gserviceaccount.com \
            --set-env-vars NODE_ENV=production,GOOGLE_PROJECT_ID=mission-control-495711 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2
