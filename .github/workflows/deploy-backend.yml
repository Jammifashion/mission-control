name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'

# Standard nur lesend; der Deploy-Job erweitert um id-token (Workload Identity).
permissions:
  contents: read

jobs:
  # Erst testen, dann deployen. Vorher ging jeder Push auf backend/** ungeprueft
  # nach Cloud Run, obwohl die Suite lokal vorhanden und gruen war.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      # Bekannte Luecken in Abhaengigkeiten sichtbar machen - nur Warnung, stoppt den Deploy nie
      # (offen bleiben bewusst z. B. uuid ueber exceljs 4.4.0; Bericht FIX4).
      - name: Abhaengigkeiten pruefen (npm audit, nur Warnung)
        run: npm audit --audit-level=moderate || echo "::warning::npm audit meldet Luecken in Abhaengigkeiten (siehe Log)"
        working-directory: backend
        continue-on-error: true

      - name: Run tests
        run: npm test
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # SI2: Betriebsangaben (Projekt, Dienstkonto, Workload-Identity-Anbieter) stehen als GitHub-Repo-Variablen
    # (Settings -> Secrets and variables -> Actions -> Variables), nicht im Repo. Region und Service-Name bleiben hier.
    env:
      GCP_PROJECT_ID:   ${{ vars.GCP_PROJECT_ID }}
      GCP_SA:           ${{ vars.GCP_SA }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      REGION: europe-west1

    steps:
      # Fehlt eine Variable, stoppt der Deploy hier mit klarer Meldung - nie mit leerem Projekt/Konto weiter.
      - name: Repo-Variablen pruefen
        run: |
          fehlt=""
          for n in GCP_PROJECT_ID GCP_SA GCP_WIF_PROVIDER; do
            if [ -z "${!n}" ]; then fehlt="$fehlt $n"; fi
          done
          if [ -n "$fehlt" ]; then
            echo "::error::GitHub-Repo-Variable(n) fehlen:$fehlt (Settings -> Secrets and variables -> Actions -> Variables). Kein Deploy."
            exit 1
          fi
          case "$GCP_SA" in *@*.iam.gserviceaccount.com) ;; *) echo "::error::GCP_SA ist keine Dienstkonto-Adresse. Kein Deploy."; exit 1;; esac
          case "$GCP_WIF_PROVIDER" in projects/*/locations/global/workloadIdentityPools/*/providers/*) ;; *) echo "::error::GCP_WIF_PROVIDER hat nicht die Form projects/<nr>/locations/global/workloadIdentityPools/<pool>/providers/<anbieter>. Kein Deploy."; exit 1;; esac
          echo "Repo-Variablen vorhanden."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Google Auth (Workload Identity)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}
          token_format: 'access_token'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      # :latest wird weiter mitgeschoben (bequem fuer "was laeuft ungefaehr"),
      # deployt wird aber der Commit-Tag - sonst ist bei zwei kurz
      # aufeinanderfolgenden Pushes nicht festgelegt, welcher Stand laeuft,
      # und ein Rollback ueber einen Re-Run des alten Workflows greift ins Leere.
      # MC_COMMIT/MC_GEBAUT landen per Build-Arg im Image und erscheinen in
      # GET /health (backend/utils/stand.js). Kein Env-Var am Service - das
      # --set-env-vars unten wuerde sie ohnehin bei jedem Deploy ersetzen.
      - name: Build and push Docker image
        run: |
          IMAGE=${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/mission-control/backend
          MC_COMMIT="${GITHUB_SHA::7}"
          MC_GEBAUT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Stand: $MC_COMMIT gebaut $MC_GEBAUT"
          docker build             --build-arg MC_COMMIT="$MC_COMMIT"             --build-arg MC_GEBAUT="$MC_GEBAUT"             -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # Eine Instanz (--max-instances 1 unten, NICHT erhoehen): die Schreibsperren (Korb, Lager, Auftraege, FP,
      # Abrechnung …) gelten nur je Instanz/Prozess - mit zwei Instanzen koennten zwei Laeufe gleichzeitig schreiben.
      # Gleichzeitige Anfragen laufen trotzdem parallel (Standard 80 je Instanz).
      # FIX3: Zeitlimit ausdruecklich 600 s (Standard war 300 s) - Backup mit Kontingent-Pause und die Syncs mit
      # Shop-Takt kamen an 300 s heran. Die Workflows warten mit curl --max-time 600 genauso lange.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mission-control-backend \
            --image ${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/mission-control/backend:${{ github.sha }} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --service-account ${GCP_SA} \
            --set-env-vars NODE_ENV=production,GOOGLE_PROJECT_ID=${GCP_PROJECT_ID} \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 600
