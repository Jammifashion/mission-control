name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # FIX3 B3: die Oberflaechen-Tests liegen in backend/tests und liefen bisher nur bei Aenderungen an backend/**.
  # Jetzt vor jedem Pages-Deploy; ein roter Test stoppt die Veroeffentlichung.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  deploy:
    name: Deploy frontend
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Der Service-Worker-Cache-Name muss sich bei jedem Deploy aendern, sonst
      # bleibt der alte Cache gueltig und die Geraete behalten die alte
      # index.html (Befund C10). Handnummern wurden vergessen - darum der SHA.
      - name: Cache-Version stempeln
        run: |
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/" frontend/sw.js
          if grep -q "__BUILD_VERSION__" frontend/sw.js; then
            echo "::error::Platzhalter __BUILD_VERSION__ steht noch in frontend/sw.js"
            exit 1
          fi
          grep -n "const BUILD_VERSION" frontend/sw.js

      # Stand der Oberflaeche fuer die Fusszeile (index.html, Meta-Tags
      # mc-commit/mc-gebaut). Nur diese zwei Platzhalter - das Repo und die
      # Actions-Logs sind oeffentlich, hier gehoert nichts anderes hinein.
      - name: Stand stempeln
        run: |
          MC_COMMIT="${GITHUB_SHA::7}"
          MC_GEBAUT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/__MC_COMMIT__/${MC_COMMIT}/; s/__MC_GEBAUT__/${MC_GEBAUT}/" frontend/index.html
          if grep -q "__MC_" frontend/index.html; then
            echo "::error::Platzhalter __MC_ steht noch in frontend/index.html"
            exit 1
          fi
          grep -n 'name="mc-' frontend/index.html

      # SI2: CSP Stufe 2 - je Seite die sha256-Hashes der Inline-Skripte statt 'unsafe-inline' in script-src
      # (NACH allem Stempeln, die Skripte duerfen sich danach nicht mehr aendern). Abweichung = Deploy bricht ab.
      - name: CSP-Hashes setzen
        run: |
          SEITEN="frontend/index.html frontend/partner.html frontend/partner-festpreis.html frontend/bestellen.html frontend/anfrage.html"
          node .github/scripts/csp-hashes.mjs --schreiben $SEITEN
          node .github/scripts/csp-hashes.mjs --pruefen $SEITEN

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # GH1: Artefaktname je Versuch - sonst findet deploy-pages bei "Re-run" mehrere
      # "github-pages"-Artefakte (eins je Versuch) und bricht ab.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/
          name: github-pages-${{ github.run_attempt }}

      # SI2: deploy-pages v4.0.5 (2024, Node 20) fand am 21.11. das hochgeladene Artefakt nicht mehr ("No artifacts named
      # github-pages-N"), zweimal hintereinander, GitHub ohne Stoerung. Daher alle drei Pages-Aktionen auf die Node-24-Staende.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
