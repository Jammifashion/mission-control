name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Der Service-Worker-Cache-Name muss sich bei jedem Deploy aendern, sonst
      # bleibt der alte Cache gueltig und die Geraete behalten die alte
      # index.html (Befund C10). Handnummern wurden vergessen - darum der SHA.
      - name: Cache-Version stempeln
        run: |
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/" frontend/sw.js
          if grep -q "__BUILD_VERSION__" frontend/sw.js; then
            echo "::error::Platzhalter __BUILD_VERSION__ steht noch in frontend/sw.js"
            exit 1
          fi
          grep -n "const BUILD_VERSION" frontend/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
