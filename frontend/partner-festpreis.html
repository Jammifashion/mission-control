<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <script>
    // ── Portal-Token: Anfang (PPS1, wortgleich in partner.html und partner-festpreis.html, Test partner-token.test.js) ──
    // Der Link bleibt derselbe (?token=...). Beim Oeffnen wird der Token gelesen, in sessionStorage dieses Tabs gelegt
    // (Neu laden geht weiter) und sofort aus der Adresse entfernt - so landet er nicht im Verlauf, nicht in einem neuen
    // Lesezeichen und nicht in einem Referrer. Alte Lesezeichen mit Token funktionieren weiter.
    window.PORTAL_TOKEN = (function () {
      var schluessel = 'portal_token:' + location.pathname;
      var p = new URLSearchParams(location.search);
      var t = (p.get('token') || '').trim();
      try {
        if (t) sessionStorage.setItem(schluessel, t);
        else t = sessionStorage.getItem(schluessel) || '';
      } catch (e) { /* Speicher gesperrt: Token gilt nur fuer diesen Aufruf */ }
      if (p.has('token')) {
        p.delete('token');
        var rest = p.toString();
        try { history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash); } catch (e) { /* alter Browser */ }
      }
      return t;
    })();
    // ── Portal-Token: Ende ──
  </script>

  <title>Festpreis Partner Portal – JammiFashion</title>
    <script>
    // FK3: Farbdarstellung vor dem ersten Zeichnen setzen (kein Aufblitzen). Wahl je Geraet, getrennt von MC (mc_theme).
    // ── Theme: Anfang (reine Logik wie MC, Schluessel partner_theme, wortgleich in partner-festpreis.html; Test backend/tests/partner-farben.test.js) ──
    var PT_THEME_WAHLEN = ['system', 'light', 'dark'];
    function ptThemeLies(speicher) {
      try { var w = speicher ? speicher.getItem('partner_theme') : null; return PT_THEME_WAHLEN.indexOf(w) >= 0 ? w : 'system'; } catch (e) { return 'system'; }
    }
    function ptThemeSchreib(speicher, wahl) {
      try { if (!speicher) return false; if (wahl === 'system') speicher.removeItem('partner_theme'); else speicher.setItem('partner_theme', wahl); return true; } catch (e) { return false; }
    }
    function ptThemeModus(wahl, matchMedia) {
      if (wahl === 'light' || wahl === 'dark') return wahl;
      try { return matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { return 'dark'; }
    }
    function ptThemeAnwenden(doc, wahl, matchMedia) {
      var modus = ptThemeModus(wahl, matchMedia);
      doc.documentElement.setAttribute('data-theme', modus);
      doc.documentElement.setAttribute('data-theme-wahl', wahl);
      return modus;
    }
    /** Browser-Leiste: theme-color = aktuelles --bg (kein fester Wert im Code). */
    function ptThemeMeta(doc, win) {
      var m = doc.querySelector('meta[name="theme-color"]');
      if (!m || !win || !win.getComputedStyle) return;
      var bg = win.getComputedStyle(doc.documentElement).getPropertyValue('--bg').trim();
      if (bg) m.setAttribute('content', bg);
    }
    // ── Theme: Ende ──
    (function () {
      var speicher = null;
      try { speicher = window.localStorage; } catch (e) { speicher = null; }
      var mm = window.matchMedia ? window.matchMedia.bind(window) : null;
      var wahl = ptThemeLies(speicher);
      ptThemeAnwenden(document, wahl, mm);
      window.ptTheme = {
        wahl: function () { return wahl; },
        setze: function (neu) {
          wahl = PT_THEME_WAHLEN.indexOf(neu) >= 0 ? neu : 'system';
          ptThemeSchreib(speicher, wahl);
          var modus = ptThemeAnwenden(document, wahl, mm);
          ptThemeMeta(document, window);
          return modus;
        },
      };
      try {
        var q = mm && mm('(prefers-color-scheme: light)');
        var folge = function () { if (wahl === 'system') { ptThemeAnwenden(document, wahl, mm); ptThemeMeta(document, window); } };
        if (q && q.addEventListener) q.addEventListener('change', folge); else if (q && q.addListener) q.addListener(folge);
        document.addEventListener('visibilitychange', function () { if (!document.hidden && ptThemeModus(wahl, mm) !== document.documentElement.getAttribute('data-theme')) folge(); });
      } catch (e) { /* aelterer Browser: bleibt beim Startwert */ }
      document.addEventListener('DOMContentLoaded', function () { ptThemeMeta(document, window); });
    })();
  </script>
  <link rel="stylesheet" href="farben.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Farben: farben.css (FK4) - gleiche Datei wie MC, hier keine Farbwerte. */
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px; min-height: 100vh;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem; display: flex; align-items: center;
      justify-content: space-between; gap: 0.6rem 1rem; flex-wrap: wrap;
    }
    .kopf-rechts { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
    /* FK3: Umschalter Farbdarstellung (System | Hell | Dunkel), Hinweis bei Maus und Antippen (Fokus), kein title */
    .theme-schalter { position: relative; display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--bg); }
    .theme-schalter button { background: none; border: none; color: var(--muted); font: inherit; font-size: 0.8rem; min-width: 36px; min-height: 32px; padding: 0 0.55rem; border-radius: 999px; cursor: pointer; }
    .theme-schalter button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
    .theme-schalter button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .theme-schalter::after { content: attr(data-tipp); position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; width: max-content; max-width: min(15rem, 80vw);
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.55rem; font-size: 0.76rem; line-height: 1.35;
      box-shadow: 0 4px 14px var(--shadow); opacity: 0; pointer-events: none; transition: opacity 0.12s; }
    .theme-schalter:hover::after, .theme-schalter:focus-within::after { opacity: 1; }
    header .logo { font-size: 1.05rem; color: var(--text); font-weight: 700; letter-spacing: 0.02em; }
    header .partner-name { font-size: 0.9rem; color: var(--muted); }
    main { max-width: 1060px; margin: 0 auto; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.1rem; }
    .card-header h2 { font-size: 1rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead tr { border-bottom: 1px solid var(--border); }
    th { padding: 0.55rem 0.8rem; text-align: left; color: var(--muted); font-weight: 500; font-size: 0.82rem; white-space: nowrap; }
    td { padding: 0.6rem 0.8rem; border-bottom: 1px solid color-mix(in srgb, var(--text) 4%, transparent); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 0.22rem 0.65rem; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .badge-offen       { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
    .badge-abgerechnet { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .badge-entwurf     { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--text); }
    .badge-freigegeben { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; height: 80px; }
    @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
    .empty { color: var(--muted); font-size: 0.88rem; padding: 1.5rem 0; }
    .btn { background: var(--accent); color: var(--accent-text); border: none; border-radius: 6px; padding: 0.45rem 1.1rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.88; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.9rem; font-size: 0.84rem; cursor: pointer; }
    .btn-outline:hover { border-color: var(--focus); color: var(--focus); }
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55vh; gap: 1rem; }
    #splash p { color: var(--muted); font-size: 0.92rem; }
    .error-box { background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); border-radius: 8px; padding: 1.5rem 2rem; text-align: center; }
    .error-box p { color: var(--danger); font-size: 1rem; line-height: 1.6; }
    .api-cfg { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .api-cfg label { font-size: 0.84rem; color: var(--muted); white-space: nowrap; }
    .api-cfg input { flex: 1; min-width: 200px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem 0.75rem; color: var(--text); font-size: 0.88rem; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    /* Saldo-Block */
    .saldo-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.4rem 0; font-size: 0.92rem; }
    .saldo-row.muted { color: var(--muted); font-size: 0.86rem; }
    .saldo-row .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
    .saldo-divider { border: none; border-top: 1px solid var(--border); margin: 0.4rem 0; }
    .saldo-final { font-size: 1.05rem; font-weight: 700; padding-top: 0.4rem; }
    .saldo-positive { color: var(--success); }
    .saldo-negative { color: var(--danger); }
    /* Abrechnung */
    .abr-card { padding-top: 1.25rem; margin-top: 1.25rem; border-top: 1px solid var(--border); }
    .abr-card:first-child { padding-top: 0; margin-top: 0; border-top: none; }
    .abr-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; padding-bottom: 0.6rem; margin-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
    .abr-zeitraum { font-size: 0.86rem; color: var(--muted); }
    .abr-summe { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .abr-summe.pos { color: var(--success); }
    .summary { font-size: 0.84rem; color: var(--muted); margin-bottom: 0.85rem; }
    .summary strong { color: var(--text); }
    /* Kalkulations-Info */
    .kalk-info { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 0.75rem; }
    .kalk-info-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; }
    .kalk-info-label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.25rem; }
    .kalk-info-value { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    /* PP3: alte Regel (Spalten ab 5 ausblenden) nur noch fuer Tabellen ohne Handy-Karten - versteckte sonst Status und Betrag */
    @media (max-width: 600px) {
      table:not(.pl-tabelle) th:nth-child(n+5), table:not(.pl-tabelle) td:nth-child(n+5) { display: none; }
    }
    /* Eigenauftrag-Formular */
    .ea-form { display: flex; flex-direction: column; gap: 0.85rem; max-width: 520px; }
    .ea-label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.84rem; color: var(--muted); }
    .ea-input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.75rem; color: var(--text); font-size: 0.9rem; font-family: inherit; }
    .ea-input:focus { outline: none; border-color: var(--focus); }
    .ea-fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .ea-fieldset legend { font-size: 0.84rem; color: var(--muted); padding: 0 0.4rem; }
    .ea-radio { font-size: 0.88rem; color: var(--text); display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    .ea-adresse { display: flex; flex-direction: column; gap: 0.5rem; }
    .ea-msg-ok { background: color-mix(in srgb, var(--success) 12%, transparent); border: 1px solid color-mix(in srgb, var(--success) 40%, transparent); color: var(--success); padding: 0.7rem 1rem; border-radius: 6px; font-size: 0.88rem; }
    /* ── Portal-Listen CSS: Anfang (PP3, wortgleich in partner.html und partner-festpreis.html) ── */
    .pl-kopf { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .pl-kopf .summary { margin: 0; }
    .pl-schalter { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.84rem; color: var(--muted); cursor: pointer; min-height: 36px; }
    .pl-schalter input { width: 1.1rem; height: 1.1rem; margin: 0; accent-color: var(--focus); }
    .pl-wrap { overflow-x: auto; }
    .pl-storno { background: color-mix(in srgb, var(--danger) 7%, transparent); }
    .pl-rot { color: var(--danger); font-weight: 600; }
    .pl-klein { font-size: 0.72rem; }
    .pl-haupt { overflow-wrap: anywhere; }
    .pl-abschnitt > summary { cursor: pointer; list-style: none; margin-bottom: 0; }
    .pl-abschnitt > summary::-webkit-details-marker { display: none; }
    .pl-abschnitt > summary h2::after { content: ' ▾'; color: var(--muted); font-weight: 400; }
    .pl-abschnitt:not([open]) > summary h2::after { content: ' ▸'; }
    .pl-abschnitt[open] > summary { margin-bottom: 1.1rem; }
    .pl-anzahl { color: var(--muted); font-weight: 400; }
    /* Handy: Karten statt Tabelle - oben Datum | Betrag, darunter Artikel | Status, Nebenangaben klein mit Beschriftung */
    @media (max-width: 480px) {
      header { padding: 0.7rem 0.9rem; gap: 0.4rem; }
      header .logo { font-size: 0.95rem; }
      .kopf-rechts { width: 100%; margin-left: 0; flex-wrap: nowrap; justify-content: space-between; }
      header .partner-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.82rem; }
      main { padding: 1rem 0.7rem; gap: 1rem; }
      .card { padding: 1rem 0.9rem; }
      .pl-wrap { overflow-x: visible; }
      table.pl-tabelle, table.pl-tabelle tbody { display: block; }
      table.pl-tabelle thead { display: none; }
      table.pl-tabelle tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 0.75rem; padding: 0.6rem 0.3rem; border-bottom: 1px solid var(--border); }
      table.pl-tabelle tr:last-child { border-bottom: none; }
      table.pl-tabelle td { display: block; padding: 0; border: 0; text-align: left; min-width: 0; font-size: 0.9rem; }
      table.pl-tabelle td.pl-datum { grid-column: 1; grid-row: 1; font-size: 0.8rem; color: var(--muted); }
      table.pl-tabelle td.pl-betrag { grid-column: 2; grid-row: 1; text-align: right; font-weight: 600; white-space: nowrap; }
      table.pl-tabelle td.pl-haupt { grid-column: 1; grid-row: 2; font-weight: 600; }
      table.pl-tabelle td.pl-status { grid-column: 2; grid-row: 2; text-align: right; align-self: start; }
      table.pl-tabelle td.pl-neben { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }
      table.pl-tabelle td.pl-neben::before { content: attr(data-label) ": "; }
    }
    /* ── Portal-Listen CSS: Ende ── */
    .ea-msg-err { background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); padding: 0.7rem 1rem; border-radius: 6px; font-size: 0.88rem; }
  </style>

<body>

  <header>
    <span class="logo">JammiFashion – Festpreis Partner Portal</span>
    <div class="kopf-rechts">
      <span class="partner-name" id="partner-name-header"></span>
      <div class="theme-schalter" id="theme-schalter" role="group" aria-label="Farbdarstellung" data-tipp="Farbdarstellung: System, Hell oder Dunkel">
        <button type="button" data-theme-knopf="system" aria-pressed="true" aria-label="System">Auto</button>
        <button type="button" data-theme-knopf="light" aria-pressed="false" aria-label="Hell">☀</button>

      </div>

  <main id="main-content">

      <p>Daten werden geladen…</p>

  <script>
    const params   = new URLSearchParams(location.search);
    const TOKEN    = window.PORTAL_TOKEN || '';   // PPS1: aus dem Block Portal-Token (Adresse ist schon bereinigt)

    // Backend-URL steht fest im Code. Frueher war sie ueber ?api= setzbar und
    // landete in localStorage['mc_api_url'] - dieser Key wird von allen drei
    // Seiten auf dieser Origin geteilt, ein praeparierter Portal-Link konnte
    // damit auch das Admin-Dashboard auf einen fremden Host umbiegen und
    // dessen X-API-Key dorthin schicken. Parameter und Key sind entfernt.
    const API_BASE = 'https://mission-control-backend-181760755456.europe-west1.run.app';
    // Altlast aus frueheren Links einmalig wegraeumen.
    try { localStorage.removeItem('mc_api_url'); } catch { /* Storage gesperrt */ }
    let PARTNER_ID = '';

    const main = document.getElementById('main-content');

    // ── Portal-Listen: Anfang (PP3, wortgleich in partner.html und partner-festpreis.html, Test partner-listen.test.js) ──
    // Inhaber 06.11.: Listen zeigen standardmaessig nur Offenes (noch nicht abgerechnet = seit der letzten Abrechnung).
    // "auch abgerechnete anzeigen" je Geraet (localStorage, Standard aus). Summen/Saldo rechnen davon unabhaengig.
    // Am Handy (<= 480 px) werden dieselben Tabellen per CSS zu Karten (Klassen pl-datum/-betrag/-haupt/-status/-neben).
    const PL_KEY = 'partner_abgerechnet_zeigen';
    function plLies(speicher) { try { return !!speicher && speicher.getItem(PL_KEY) === '1'; } catch { return false; } }
    function plSchreib(speicher, an) {
      try { if (!speicher) return false; if (an) speicher.setItem(PL_KEY, '1'); else speicher.removeItem(PL_KEY); return true; } catch { return false; }
    }
    const plSpeicher = () => { try { return window.localStorage; } catch { return null; } };
    const plAbgerechnet = status => String(status ?? '').trim().toLowerCase() === 'abgerechnet';
    /** zeilen: [{ status, ... }] -> { zeilen (sichtbar), offen, abgerechnet, alle } */
    function plSicht(zeilen, alle) {
      const liste = zeilen ?? [];
      const offen = liste.filter(z => !plAbgerechnet(z.status));
      return { zeilen: alle ? liste : offen, offen: offen.length, abgerechnet: liste.length - offen.length, alle: !!alle };
    }
    const plEsc = x => String(x ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    /** Zeile ueber der Liste: "n offen · m abgerechnet" + Schalter (nur wenn es Abgerechnetes gibt). */
    function plKopfHtml(sicht) {
      const zahl = `${sicht.offen} offen${sicht.abgerechnet ? ` · ${sicht.abgerechnet} abgerechnet` : ''}`;
      const schalter = sicht.abgerechnet
        ? `<label class="pl-schalter"><input type="checkbox" data-pl-alle${sicht.alle ? ' checked' : ''}> auch abgerechnete anzeigen</label>` : '';
      return `<div class="pl-kopf"><span class="summary">${zahl}</span>${schalter}</div>`;
    }
    /** spalten: [{ titel, rolle: datum|betrag|haupt|status|neben, num }]; zeilen: [{ zellen: [fertiges HTML], storno }] */
    function plTabelleHtml(spalten, zeilen, leer) {
      if (!zeilen.length) return `<p class="empty">${plEsc(leer)}</p>`;
      const kopf = spalten.map(sp => `<th${sp.num ? ' class="num"' : ''}>${plEsc(sp.titel)}</th>`).join('');
      const koerper = zeilen.map(z => `<tr${z.storno ? ' class="pl-storno"' : ''}>${z.zellen.map((inhalt, i) =>
        `<td class="pl-${spalten[i].rolle}${spalten[i].num ? ' num' : ''}" data-label="${plEsc(spalten[i].titel)}">${inhalt}</td>`).join('')}</tr>`).join('');
      return `<div class="pl-wrap"><table class="pl-tabelle"><thead><tr>${kopf}</tr></thead><tbody>${koerper}</tbody></table></div>`;
    }
    const plDaten = { verkaeufe: null, intern: null };
    /** Abrechnungen: am Handy eingeklappt, am Desktop offen; Anzahl in der Ueberschrift. */
    function plAbschnittOeffnen() {
      const box = document.getElementById('pv-abr-box');
      if (box) box.open = !(window.matchMedia && window.matchMedia('(max-width: 480px)').matches);
    }
    function plAnzahlSetzen(n) { const el = document.getElementById('pv-abr-anzahl'); if (el) el.textContent = `(${n})`; }
    document.addEventListener('change', ev => {
      const cb = ev.target.closest ? ev.target.closest('[data-pl-alle]') : null;
      if (!cb) return;
      plSchreib(plSpeicher(), cb.checked);
      renderVerkaeufe(); renderIntern();
    });
    // ── Portal-Listen: Ende ──

    // FK3: Umschalter Farbdarstellung (Logik im <head>, Block "Theme")
    function themeKnoepfeZeigen() {
      const w = window.ptTheme ? window.ptTheme.wahl() : 'system';
      document.querySelectorAll('[data-theme-knopf]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeKnopf === w)));
    }
    document.getElementById('theme-schalter').addEventListener('click', ev => {
      const b = ev.target.closest('[data-theme-knopf]');
      if (!b || !window.ptTheme) return;
      window.ptTheme.setze(b.dataset.themeKnopf);
      themeKnoepfeZeigen();
    });
    themeKnoepfeZeigen();

    async function apiFetch(path) {
      const r = await fetch(`${API_BASE}${path}`, {
        headers: TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {},
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(body.error || r.statusText);
        err.status = r.status;
        throw err;
      }
      return body;
    }

    async function apiPost(path, body) {
      const r = await fetch(`${API_BASE}${path}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {}),
        },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(data.error || r.statusText);
        err.status = r.status;
        throw err;
      }
      return data;
    }

    function fmt(val) {
      return Number(val || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    }

    function showError(msg) {
      main.innerHTML = `<div class="error-box" style="max-width:480px;margin:3rem auto;"><p>${msg}</p></div>`;
    }

    // ── Verkäufe (PP3: nur Offenes, Schalter "auch abgerechnete") ──
    async function loadVerkaeufe() {
      const wrap = document.getElementById('pv-verkaeufe');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton"></div>';
      try {
        plDaten.verkaeufe = (await apiFetch('/api/festpreis-public/verkaeufe')).map(r => ({ ...r, status: r['Status Abrechnung'] || 'offen' }));
        renderVerkaeufe();
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${plEsc(e.message)}</p>`;
      }
    }
    function renderVerkaeufe() {
      const wrap = document.getElementById('pv-verkaeufe');
      if (!wrap || !plDaten.verkaeufe) return;
      const rows = plDaten.verkaeufe;
      if (!rows.length) { wrap.innerHTML = '<p class="empty">Noch keine Verkäufe vorhanden.</p>'; return; }
      const sicht = plSicht(rows, plLies(plSpeicher()));
      const spalten = [{ titel: 'Datum', rolle: 'datum' }, { titel: 'Bestell-Nr.', rolle: 'neben' }, { titel: 'Artikel', rolle: 'haupt' },
        { titel: 'Menge', rolle: 'betrag', num: true }, { titel: 'Status', rolle: 'status' }];
      const zeilen = sicht.zeilen.map(r => {
        const storno = !!(r['Storno-Status'] || '').trim() || Number(r['Stückzahl'] || 0) < 0;
        return { storno, zellen: [plEsc(r['Datum']), plEsc(r['WC-Bestellnummer']), `${plEsc(r['Artikelname'])}${storno ? ' <span class="pl-rot pl-klein">↩ Storno</span>' : ''}`,
          `<span class="${storno ? 'pl-rot' : ''}">${plEsc(r['Stückzahl'])}</span>`, `<span class="badge badge-${plEsc(String(r.status).toLowerCase())}">${plEsc(r.status)}</span>`] };
      });
      wrap.innerHTML = plKopfHtml(sicht) + plTabelleHtml(spalten, zeilen, 'Seit der letzten Abrechnung noch keine Verkäufe.');
    }

    // ── Direkte (interne) Bestellungen (PP3: nur Offenes) ──
    async function loadIntern() {
      const wrap = document.getElementById('pv-intern');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton"></div>';
      try {
        plDaten.intern = (await apiFetch('/api/festpreis-public/intern')).map(r => ({ ...r, status: r.status || 'offen' }));
        renderIntern();
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${plEsc(e.message)}</p>`;
      }
    }
    function renderIntern() {
      const wrap = document.getElementById('pv-intern');
      if (!wrap || !plDaten.intern) return;
      const rows = plDaten.intern;
      if (!rows.length) { wrap.innerHTML = '<p class="empty">Keine direkten Bestellungen vorhanden.</p>'; return; }
      const sicht = plSicht(rows, plLies(plSpeicher()));
      const spalten = [{ titel: 'Datum', rolle: 'datum' }, { titel: 'Bezeichnung', rolle: 'haupt' }, { titel: 'Anzahl', rolle: 'neben', num: true },
        { titel: 'Einzelpreis brutto', rolle: 'neben', num: true }, { titel: 'Summe', rolle: 'betrag', num: true }, { titel: 'Status', rolle: 'status' }];
      const zeilen = sicht.zeilen.map(r => ({ zellen: [plEsc(r.datum), plEsc(r.bezeichnung), plEsc(r.anzahl), fmt(r.einzelpreis), `<strong>${fmt(r.summe)}</strong>`,
        `<span class="badge badge-${plEsc(String(r.status).toLowerCase())}">${plEsc(r.status)}</span>`] }));
      wrap.innerHTML = plKopfHtml(sicht) + plTabelleHtml(spalten, zeilen, 'Seit der letzten Abrechnung keine direkten Bestellungen.');
    }

    // ── Saldo / offene Auszahlung ────────────────────────────────────────────
    async function loadSaldo() {
      const wrap = document.getElementById('pv-saldo');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton" style="height:120px;"></div>';
      try {
        const d = await apiFetch('/api/festpreis-public/saldo');
        const positiv  = d.saldoBrutto >= 0;
        const label    = positiv ? 'Offene Auszahlung (brutto)' : 'Aktueller Rückstand (brutto)';
        const colorCls = positiv ? 'saldo-positive' : 'saldo-negative';
        wrap.innerHTML = `
          <div class="saldo-row">
            <span>Auszahlung Verkäufe (netto)</span>
            <span class="amount saldo-positive">+${fmt(d.auszahlungNetto)}</span>
          </div>
          <div class="saldo-row muted">
            <span>zzgl. MwSt (${d.mwstProzent} %)</span>
            <span class="amount">+${fmt((d.auszahlungBrutto || 0) - (d.auszahlungNetto || 0))}</span>
          </div>
          <div class="saldo-row">
            <span>Auszahlung Verkäufe (brutto)</span>
            <span class="amount saldo-positive">+${fmt(d.auszahlungBrutto)}</span>
          </div>
          <div class="saldo-row">
            <span>Direkte Bestellungen (brutto)</span>
            <span class="amount saldo-negative">−${fmt(d.interneSumme)}</span>
          </div>
          ${d.verpackung?.status === 'ok' ? `
          <div class="saldo-row">
            <span>Verpackungspauschale: ${d.verpackung.anzahl} Bestellungen × ${fmt(d.verpackung.betrag)} (brutto)</span>
            <span class="amount saldo-negative">−${fmt(d.verpackung.summe)}</span>
          </div>` : d.verpackung ? `
          <div class="saldo-row muted">
            <span>Verpackungspauschale</span>
            <span class="amount">in Prüfung</span>
          </div>` : ''}
          <hr class="saldo-divider">
          <div class="saldo-row saldo-final">
            <span>${label}</span>
            <span class="amount ${colorCls}">${positiv ? '' : '−'}${fmt(Math.abs(d.saldoBrutto))}</span>
          </div>
          <p class="saldo-row muted" style="padding-top:0.6rem;">
            Nur offene, noch nicht abgerechnete Positionen &nbsp;·&nbsp; entspricht netto ${fmt(d.saldoNetto)}.
          </p>`;
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${e.message}</p>`;
      }
    }

    // ── Abrechnungen ─────────────────────────────────────────────────────────
    async function loadAbrechnungen() {
      const wrap = document.getElementById('pv-abrechnungen');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton"></div>';
      try {
        const rows = await apiFetch('/api/festpreis-public/abrechnungen');
        plAnzahlSetzen(rows.length);   // PP3
        if (!rows.length) { wrap.innerHTML = '<p class="empty">Noch keine Abrechnungen vorhanden.</p>'; return; }

        rows.sort((a, b) => (b['Erstellt-Am'] || '').localeCompare(a['Erstellt-Am'] || ''));
        const sumFreigegeben = rows
          .filter(r => r['Status'] === 'freigegeben')
          .reduce((s, r) => s + Number(r['Gesamt-Brutto'] || 0), 0);

        wrap.innerHTML = `
          <p class="summary">${rows.length} Abrechnung(en) &nbsp;·&nbsp; Freigegeben gesamt brutto: <strong>${fmt(sumFreigegeben)}</strong></p>
          ${rows.map(r => {
            const netto  = Number(r['Gesamt-Netto']  || 0);
            const brutto = Number(r['Gesamt-Brutto'] || 0);
            const status = r['Status'] || 'entwurf';
            let pos = null;
            try { pos = JSON.parse(r['Positionen'] || ''); } catch {}
            const intern = (pos && pos.intern) || [];
            const interneSumme = (pos && pos.interneSumme) || intern.reduce((s, i) => s + Number(i.summe || 0), 0);
            const internBlock = intern.length ? `
              <h3 style="font-size:0.9rem;margin:1rem 0 0.5rem;">Verrechnete direkte Bestellungen</h3>
              ${plTabelleHtml([{ titel: 'Datum', rolle: 'datum' }, { titel: 'Bezeichnung', rolle: 'haupt' }, { titel: 'Anzahl', rolle: 'neben', num: true }, { titel: 'Summe (brutto)', rolle: 'betrag', num: true }],
                intern.map(i => ({ zellen: [plEsc(i.datum), plEsc(i.bezeichnung), plEsc(i.anzahl), `<span class="pl-rot">−${fmt(i.summe)}</span>`] })), '')}` : '';
            return `
            <div class="abr-card">
              <div class="abr-header">
                <div>
                  <strong>${r['Abrechnungs-ID']}</strong>
                  <span class="abr-zeitraum">&nbsp;·&nbsp;${r['Zeitraum-Von']} – ${r['Zeitraum-Bis']}</span>
                  <span class="badge badge-${status}" style="margin-left:0.5rem;">${status}</span>
                </div>
                <div class="abr-summe pos">${fmt(brutto)}</div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.6rem;margin-top:0.6rem;">
                <div class="kalk-info-box">
                  <div class="kalk-info-label">Auszahlung Netto</div>
                  <div class="kalk-info-value">${fmt(netto)}</div>
                </div>
                <div class="kalk-info-box">
                  <div class="kalk-info-label">Auszahlung Brutto (inkl. MwSt.)</div>
                  <div class="kalk-info-value">${fmt(brutto)}</div>
                </div>
                <div class="kalk-info-box">
                  <div class="kalk-info-label">Erstellt am</div>
                  <div class="kalk-info-value" style="font-size:0.95rem;">${r['Erstellt-Am']}</div>
                </div>
              </div>
              ${internBlock}
              ${intern.length ? `<p class="summary" style="margin-top:0.6rem;">Auszahlung brutto ist nach Abzug der direkten Bestellungen (−${fmt(interneSumme)}) berechnet.</p>` : ''}
            </div>`;
          }).join('')}`;
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${e.message}</p>`;
      }
    }

    // ── Eigenauftrag stellen ─────────────────────────────────────────────────
    function initEigenauftrag() {
      const form = document.getElementById('ea-form');
      if (!form) return;
      const adresse = document.getElementById('ea-adresse');
      form.querySelectorAll('input[name="ea-liefer"]').forEach(r => {
        r.addEventListener('change', () => {
          const abw = form.querySelector('input[name="ea-liefer"]:checked').value === 'abweichend';
          adresse.style.display = abw ? 'flex' : 'none';
        });
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('ea-msg');
        msg.className = ''; msg.textContent = '';

        const artikel   = document.getElementById('ea-artikel').value.trim();
        const menge     = document.getElementById('ea-menge').value;
        const varianten = document.getElementById('ea-varianten').value.trim();
        if (!artikel || !menge || !varianten) {
          msg.className = 'ea-msg-err';
          msg.textContent = 'Bitte Artikel, Menge und Varianten ausfüllen.';
          return;
        }

        const payload = {
          artikel, menge: Number(menge), varianten,
          lieferTyp:     form.querySelector('input[name="ea-liefer"]:checked').value,
          lieferName:    document.getElementById('ea-name').value.trim(),
          lieferStrasse: document.getElementById('ea-strasse').value.trim(),
          lieferPlzOrt:  document.getElementById('ea-plzort').value.trim(),
          wunschtermin:  document.getElementById('ea-termin').value,
          anmerkungen:   document.getElementById('ea-anmerkungen').value.trim(),
        };

        const btn = document.getElementById('ea-submit');
        btn.disabled = true;
        try {
          await apiPost(`/api/partner/${encodeURIComponent(PARTNER_ID)}/eigenauftrag`, payload);
          msg.className = 'ea-msg-ok';
          msg.textContent = 'Dein Auftrag wurde übermittelt.';
          form.reset();
          adresse.style.display = 'none';
        } catch (err) {
          msg.className = 'ea-msg-err';
          msg.textContent = `Fehler: ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      });
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      if (!TOKEN) {
        showError('Kein Token in der URL.<br>Bitte nutze den Link deines Ansprechpartners bei JammiFashion.');
        return;
      }

      main.innerHTML = '<div class="skeleton" style="height:60px;border-radius:8px;"></div>';
      try {
        const me = await apiFetch('/api/festpreis-public/auth');
        PARTNER_ID = me.partnerId || '';
        document.getElementById('partner-name-header').textContent = me.partnerName;
        document.title = `${me.partnerName} – JammiFashion Festpreis Portal`;
      } catch (e) {
        if (e.status === 401 || e.status === 403)
          showError('Kein Zugang.<br>Dein Token ist ungültig oder dein Konto ist nicht aktiv.');
        else showError(`Fehler beim Laden: ${e.message}`);
        return;
      }

      main.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2>Offene Auszahlung</h2>
          </div>
          <div id="pv-saldo"><div class="skeleton" style="height:120px;"></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Meine Verkäufe</h2>
            <button class="btn-outline" id="btn-refresh">↻ Aktualisieren</button>
          </div>
          <div id="pv-verkaeufe"><div class="skeleton"></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Meine direkten Bestellungen</h2>
          </div>
          <div id="pv-intern"><div class="skeleton"></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Eigenauftrag stellen</h2>
          </div>
          <form id="ea-form" class="ea-form">
            <div id="ea-msg"></div>
            <label class="ea-label">Artikel / Produkt *
              <input class="ea-input" id="ea-artikel" type="text" required>
            </label>
            <label class="ea-label">Menge *
              <input class="ea-input" id="ea-menge" type="number" min="1" step="1" required>
            </label>
            <label class="ea-label">Größen / Varianten *
              <input class="ea-input" id="ea-varianten" type="text" placeholder="z.B. 5x S, 10x M, 3x XL" required>
            </label>
            <fieldset class="ea-fieldset">
              <legend>Lieferadresse</legend>
              <label class="ea-radio"><input type="radio" name="ea-liefer" value="mich" checked> An mich</label>
              <label class="ea-radio"><input type="radio" name="ea-liefer" value="abweichend"> Abweichende Adresse</label>
              <div id="ea-adresse" class="ea-adresse" style="display:none;">
                <input class="ea-input" id="ea-name" type="text" placeholder="Name">
                <input class="ea-input" id="ea-strasse" type="text" placeholder="Straße & Hausnummer">
                <input class="ea-input" id="ea-plzort" type="text" placeholder="PLZ & Ort">
              </div>
            </fieldset>
            <label class="ea-label">Wunschtermin
              <input class="ea-input" id="ea-termin" type="date">
            </label>
            <label class="ea-label">Anmerkungen
              <textarea class="ea-input" id="ea-anmerkungen" rows="3"></textarea>
            </label>
            <button class="btn" type="submit" id="ea-submit">Eigenauftrag absenden</button>
          </form>
        </div>
        <details class="card pl-abschnitt" id="pv-abr-box">
          <summary class="card-header"><h2>Meine Abrechnungen <span class="pl-anzahl" id="pv-abr-anzahl"></span></h2></summary>
          <div id="pv-abrechnungen"><div class="skeleton"></div></div>
        </details>`;
      plAbschnittOeffnen();   // PP3

      document.getElementById('btn-refresh').addEventListener('click', () => {
        loadVerkaeufe();
        loadIntern();
        loadSaldo();
        loadAbrechnungen();
      });

      initEigenauftrag();

      await Promise.all([loadVerkaeufe(), loadIntern(), loadSaldo(), loadAbrechnungen()]);
    }

    init();
  </script>
</body>
</html>
