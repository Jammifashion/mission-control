  <script>
    // ── Portal-Token: Anfang (PPS1, wortgleich in partner.html und partner-festpreis.html, Test partner-token.test.js) ──
    // Der Link bleibt derselbe (?token=...). Beim Oeffnen wird der Token gelesen, in sessionStorage dieses Tabs gelegt
    // (Neu laden geht weiter) und sofort aus der Adresse entfernt - so landet er nicht im Verlauf, nicht in einem neuen
    // Lesezeichen und nicht in einem Referrer. Alte Lesezeichen mit Token funktionieren weiter.
    window.PORTAL_TOKEN = (function () {
      var schluessel = 'portal_token:' + location.pathname;
      var p = new URLSearchParams(location.search);
      var t = (p.get('token') || '').trim();
      try {
        if (t) sessionStorage.setItem(schluessel, t);
        else t = sessionStorage.getItem(schluessel) || '';
      } catch (e) { /* Speicher gesperrt: Token gilt nur fuer diesen Aufruf */ }
      if (p.has('token')) {
        p.delete('token');
        var rest = p.toString();
        try { history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash); } catch (e) { /* alter Browser */ }
      }
      return t;
    })();
    // ── Portal-Token: Ende ──
  </script>

  <script>
    // FK3: Farbdarstellung vor dem ersten Zeichnen setzen (kein Aufblitzen). Wahl je Geraet, getrennt von MC (mc_theme).
    // ── Theme: Anfang (reine Logik wie MC, Schluessel partner_theme, wortgleich in partner-festpreis.html; Test backend/tests/partner-farben.test.js) ──
    var PT_THEME_WAHLEN = ['system', 'light', 'dark'];
    function ptThemeLies(speicher) {
      try { var w = speicher ? speicher.getItem('partner_theme') : null; return PT_THEME_WAHLEN.indexOf(w) >= 0 ? w : 'system'; } catch (e) { return 'system'; }
    }
    function ptThemeSchreib(speicher, wahl) {
      try { if (!speicher) return false; if (wahl === 'system') speicher.removeItem('partner_theme'); else speicher.setItem('partner_theme', wahl); return true; } catch (e) { return false; }
    }
    function ptThemeModus(wahl, matchMedia) {
      if (wahl === 'light' || wahl === 'dark') return wahl;
      try { return matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { return 'dark'; }
    }
    function ptThemeAnwenden(doc, wahl, matchMedia) {
      var modus = ptThemeModus(wahl, matchMedia);
      doc.documentElement.setAttribute('data-theme', modus);
      doc.documentElement.setAttribute('data-theme-wahl', wahl);
      return modus;
    }
    /** Browser-Leiste: theme-color = aktuelles --bg (kein fester Wert im Code). */
    function ptThemeMeta(doc, win) {
      var m = doc.querySelector('meta[name="theme-color"]');
      if (!m || !win || !win.getComputedStyle) return;
      var bg = win.getComputedStyle(doc.documentElement).getPropertyValue('--bg').trim();
      if (bg) m.setAttribute('content', bg);
    }
    // ── Theme: Ende ──
    (function () {
      var speicher = null;
      try { speicher = window.localStorage; } catch (e) { speicher = null; }
      var mm = window.matchMedia ? window.matchMedia.bind(window) : null;
      var wahl = ptThemeLies(speicher);
      ptThemeAnwenden(document, wahl, mm);
      window.ptTheme = {
        wahl: function () { return wahl; },
        setze: function (neu) {
          wahl = PT_THEME_WAHLEN.indexOf(neu) >= 0 ? neu : 'system';
          ptThemeSchreib(speicher, wahl);
          var modus = ptThemeAnwenden(document, wahl, mm);
          ptThemeMeta(document, window);
          return modus;
        },
      };
      try {
        var q = mm && mm('(prefers-color-scheme: light)');
        var folge = function () { if (wahl === 'system') { ptThemeAnwenden(document, wahl, mm); ptThemeMeta(document, window); } };
        if (q && q.addEventListener) q.addEventListener('change', folge); else if (q && q.addListener) q.addListener(folge);
        document.addEventListener('visibilitychange', function () { if (!document.hidden && ptThemeModus(wahl, mm) !== document.documentElement.getAttribute('data-theme')) folge(); });
      } catch (e) { /* aelterer Browser: bleibt beim Startwert */ }
      document.addEventListener('DOMContentLoaded', function () { ptThemeMeta(document, window); });
    })();
  </script>

      .pu-raster.pu-ohne-saldo { grid-template-areas: "off off off off pr pr pr pr jahr jahr jahr jahr" "kurve kurve kurve kurve kurve kurve kurve kurve top top top top"; }
      .pu-raster.pu-mit-detail { grid-template-areas: "aus aus aus off off off pr pr pr jahr jahr jahr" "ums ums ums ums ums ums erl erl erl erl erl erl"
        "kurve kurve kurve kurve kurve kurve kurve kurve top top top top"; }
      .pu-raster.pu-mit-detail.pu-ohne-saldo { grid-template-areas: "off off off off pr pr pr pr jahr jahr jahr jahr" "ums ums ums ums ums ums erl erl erl erl erl erl"
        "kurve kurve kurve kurve kurve kurve kurve kurve top top top top"; }
    }
    .pu-kachel { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 0.15rem; min-height: 96px; padding: 0.9rem 1rem;
      text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font: inherit; cursor: pointer; }
    .pu-kachel:hover, .pu-kachel:focus-visible { border-color: var(--info); }
    .pu-kachel:focus-visible, .pu-i:focus-visible, .pu-details > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .pu-zahl { font-size: 1.6rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
    .pu-label { font-size: 0.85rem; color: var(--text); }
    .pu-klein { font-size: 0.78rem; }
    .pu-plus .pu-zahl { color: var(--success); }
    .pu-minus .pu-zahl { color: var(--warning); }
    .pu-chip { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
    .pu-chip-gut { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .pu-chip-warn { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
    .pu-karte { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; min-width: 0; }
    .pu-kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
    .pu-kopf h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }
    .pu-i { flex: none; width: 44px; height: 44px; margin: -10px 0 -10px 0; background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; border-radius: 999px; }
    .pu-i:hover { color: var(--text); }
    .pu-aus > .pu-i { position: absolute; top: 0; right: 0; margin: 0; }
    .pu-aus .pu-label { padding-right: 2.2rem; }
    .pu-info { margin: 0 0 0.5rem; padding: 0.5rem 0.65rem; border-radius: 6px; background: var(--surface-2); color: var(--text); font-size: 0.82rem; line-height: 1.4; }
    .pu-satz { margin: 0.4rem 0 0; font-size: 0.92rem; color: var(--text); }
    .pu-leer { margin: 0.6rem 0; color: var(--muted); font-size: 0.9rem; }
    .pu-legende { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; margin: 0.3rem 0 0; font-size: 0.8rem; color: var(--muted); }
    .pu-strich { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--info); vertical-align: middle; margin-right: 0.3rem; }
    .pu-strich.pu-vj { border-top: 2px dashed var(--muted); }
    .dg-linie { display: block; width: 100%; height: auto; max-height: 260px; }
    .pu-punkt { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--info); vertical-align: middle; margin-right: 0.3rem; }
    .dg-balken { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.2rem 0.75rem; align-items: center; font-size: 0.9rem; }
    .dg-balken-name { overflow-wrap: anywhere; color: var(--text); }
    .dg-balken-zahl { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .dg-balken-spur { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); margin-bottom: 0.45rem; }
    .dg-balken-wert { display: block; height: 100%; border-radius: 4px; background: var(--info); }
    .pu-tipp { position: relative; }
    .pu-tipp::after { content: attr(data-tipp); position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: max-content; max-width: min(18rem, 80vw);
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.55rem; font-size: 0.76rem;
      line-height: 1.35; font-weight: 400; text-align: left; box-shadow: 0 4px 14px var(--shadow); pointer-events: none; display: none; }
    .pu-tipp.pu-rechts::after { left: auto; right: 0; }
    /* nur bei Maus bzw. Tastatur-Fokus im Layout - sonst zaehlt der verborgene Text als Ueberlauf */
    @media (hover: hover) { .pu-tipp:hover::after { display: block; } }
    .pu-tipp:focus-visible::after { display: block; }
    .pu-details > summary { min-height: 44px; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--info); font-weight: 600; list-style: none; }
    .pu-details > summary::-webkit-details-marker { display: none; }
    .pu-details > summary::before { content: '▸'; transition: transform 0.15s; }
    .pu-details[open] > summary::before { transform: rotate(90deg); }
    .pu-details[open] > summary { margin-bottom: 0.75rem; }
    .pu-details-inhalt { display: flex; flex-direction: column; gap: 1.5rem; }
    @media (max-width: 480px) { .pu-zahl { font-size: 1.35rem; } .pu-kachel { padding: 0.75rem 0.8rem; } .pu-details-inhalt { gap: 1rem; } }
    /* ── Partner-Übersicht CSS: Ende ── */
  </style>
</head>
<body>

  <header>
    <span class="logo" id="shop-logo">JammiFashion – Partner Portal</span>
    <div class="kopf-rechts">
      <span class="partner-name" id="partner-name-header"></span>
      <div class="theme-schalter" id="theme-schalter" role="group" aria-label="Farbdarstellung" data-tipp="Farbdarstellung: System, Hell oder Dunkel">
        <button type="button" data-theme-knopf="system" aria-pressed="true" aria-label="System">Auto</button>
        <button type="button" data-theme-knopf="light" aria-pressed="false" aria-label="Hell">☀</button>
        <button type="button" data-theme-knopf="dark" aria-pressed="false" aria-label="Dunkel">☾</button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <div id="splash">
      <div class="skeleton" style="width:220px;height:22px;border-radius:4px;"></div>
      <p>Daten werden geladen…</p>
    </div>
  </main>

  <script>
    const params   = new URLSearchParams(location.search);
    const TOKEN    = window.PORTAL_TOKEN || '';   // PPS1: aus dem Block Portal-Token (Adresse ist schon bereinigt)
    // Sprint 5.4 – Multi-Shop: ?shop=jfn|honk wählt den Shop. Default 'jfn'.
    const SHOP     = (params.get('shop') === 'honk') ? 'honk' : 'jfn';

    // Backend-URL steht fest im Code. Früher war sie über ?api= setzbar und
    // landete in localStorage['mc_api_url'] – dieser Key wird von allen drei
    // Seiten auf dieser Origin geteilt, ein präparierter Portal-Link konnte
    // damit auch das Admin-Dashboard auf einen fremden Host umbiegen und
    // dessen X-API-Key dorthin schicken. Parameter und Key sind entfernt.
    const API_BASE = 'https://mission-control-backend-181760755456.europe-west1.run.app';
    // Altlast aus früheren Links einmalig wegräumen.
    try { localStorage.removeItem('mc_api_url'); } catch { /* Storage gesperrt */ }
    let PARTNER_ID = '';

    const main = document.getElementById('main-content');

    // ── Portal-Listen: Anfang (PP3, wortgleich in partner.html und partner-festpreis.html, Test partner-listen.test.js) ──
    // Inhaber 06.11.: Listen zeigen standardmaessig nur Offenes (noch nicht abgerechnet = seit der letzten Abrechnung).
    // "auch abgerechnete anzeigen" je Geraet (localStorage, Standard aus). Summen/Saldo rechnen davon unabhaengig.
    // Am Handy (<= 480 px) werden dieselben Tabellen per CSS zu Karten (Klassen pl-datum/-betrag/-haupt/-status/-neben).
    const PL_KEY = 'partner_abgerechnet_zeigen';
    function plLies(speicher) { try { return !!speicher && speicher.getItem(PL_KEY) === '1'; } catch { return false; } }
    function plSchreib(speicher, an) {
      try { if (!speicher) return false; if (an) speicher.setItem(PL_KEY, '1'); else speicher.removeItem(PL_KEY); return true; } catch { return false; }
    }
    const plSpeicher = () => { try { return window.localStorage; } catch { return null; } };
    const plAbgerechnet = status => String(status ?? '').trim().toLowerCase() === 'abgerechnet';
    /** zeilen: [{ status, ... }] -> { zeilen (sichtbar), offen, abgerechnet, alle } */
    function plSicht(zeilen, alle) {
      const liste = zeilen ?? [];
      const offen = liste.filter(z => !plAbgerechnet(z.status));
      return { zeilen: alle ? liste : offen, offen: offen.length, abgerechnet: liste.length - offen.length, alle: !!alle };
    }
    const plEsc = x => String(x ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    /** Zeile ueber der Liste: "n offen · m abgerechnet" + Schalter (nur wenn es Abgerechnetes gibt). */
    function plKopfHtml(sicht) {
      const zahl = `${sicht.offen} offen${sicht.abgerechnet ? ` · ${sicht.abgerechnet} abgerechnet` : ''}`;
      const schalter = sicht.abgerechnet
        ? `<label class="pl-schalter"><input type="checkbox" data-pl-alle${sicht.alle ? ' checked' : ''}> auch abgerechnete anzeigen</label>` : '';
      return `<div class="pl-kopf"><span class="summary">${zahl}</span>${schalter}</div>`;
    }
    /** spalten: [{ titel, rolle: datum|betrag|haupt|status|neben, num }]; zeilen: [{ zellen: [fertiges HTML], storno }] */
    function plTabelleHtml(spalten, zeilen, leer) {
      if (!zeilen.length) return `<p class="empty">${plEsc(leer)}</p>`;
      const kopf = spalten.map(sp => `<th${sp.num ? ' class="num"' : ''}>${plEsc(sp.titel)}</th>`).join('');
      const koerper = zeilen.map(z => `<tr${z.storno ? ' class="pl-storno"' : ''}>${z.zellen.map((inhalt, i) =>
        `<td class="pl-${spalten[i].rolle}${spalten[i].num ? ' num' : ''}" data-label="${plEsc(spalten[i].titel)}">${inhalt}</td>`).join('')}</tr>`).join('');
      return `<div class="pl-wrap"><table class="pl-tabelle"><thead><tr>${kopf}</tr></thead><tbody>${koerper}</tbody></table></div>`;
    }
    const plDaten = { verkaeufe: null, intern: null };
    /** Abrechnungen: am Handy eingeklappt, am Desktop offen; Anzahl in der Ueberschrift. */
    function plAbschnittOeffnen() {
      const box = document.getElementById('pv-abr-box');
      if (box) box.open = !(window.matchMedia && window.matchMedia('(max-width: 480px)').matches);
    }
    function plAnzahlSetzen(n) { const el = document.getElementById('pv-abr-anzahl'); if (el) el.textContent = `(${n})`; }
    document.addEventListener('change', ev => {
      const cb = ev.target.closest ? ev.target.closest('[data-pl-alle]') : null;
      if (!cb) return;
      plSchreib(plSpeicher(), cb.checked);
      renderVerkaeufe(); renderIntern();
    });
    // ── Portal-Listen: Ende ──

    // FK3: Umschalter Farbdarstellung (Logik im <head>, Block "Theme")
    function themeKnoepfeZeigen() {
      const w = window.ptTheme ? window.ptTheme.wahl() : 'system';
      document.querySelectorAll('[data-theme-knopf]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeKnopf === w)));
    }
    document.getElementById('theme-schalter').addEventListener('click', ev => {
      const b = ev.target.closest('[data-theme-knopf]');
      if (!b || !window.ptTheme) return;
      window.ptTheme.setze(b.dataset.themeKnopf);
      themeKnoepfeZeigen();
    });
    themeKnoepfeZeigen();

    function withShop(path) {
      const sep = path.includes('?') ? '&' : '?';
      return `${path}${sep}shop=${SHOP}`;
    }

    async function apiGet(path) {
      const r = await fetch(`${API_BASE}${withShop(path)}`, {
        headers: TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {},
      });
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        const err  = new Error(body.error || r.statusText);
        err.status = r.status;
        throw err;
      }
      return r.json();
    }

    async function apiPost(path, body) {
      const r = await fetch(`${API_BASE}${withShop(path)}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {}),
        },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(data.error || r.statusText);
        err.status = r.status;
        throw err;
      }
      return data;
    }

    function fmt(val) {
      return Number(val).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    }

    function badgeClass(s) {
      return { offen: 'badge-offen', abgerechnet: 'badge-abgerechnet',
               angefordert: 'badge-angefordert', geprüft: 'badge-geprueft', bezahlt: 'badge-bezahlt' }[s] ?? '';
    }

    // ── Diagramme: Anfang (PD1, wortgleich in partner.html und partner-festpreis.html; spaeter auch MC, Test pd1-frontend.test.js) ──
    // Selbst gezeichnet, ohne Bibliothek: Linie als SVG mit gestrichelter Vergleichslinie, waagerechte Balken als HTML.
    // Farben nur ueber var(--…) im style-Attribut - hell/dunkel wechselt ohne Neuzeichnen. null = keine Daten (keine Linie, nicht 0).
    const DG_MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const dgEsc = x => String(x ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    const dgZahl = n => Number(n || 0).toLocaleString('de-DE', { maximumFractionDigits: 2 });
    const dgEuro = n => Number(n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    const DG_STUECK = { wert: v => `${dgZahl(v)} Stück`, diff: v => dgZahl(v) };   // Formatierer fuer Saetze
    const DG_EURO = { wert: v => dgEuro(v), diff: v => dgEuro(v) };
    /** Obergrenze der Achse: 1, 2, 4 oder 5 mal Zehnerpotenz, mindestens 4 (Mittellinie = Haelfte). */
    function dgObergrenze(max) {
      const roh = Math.max(4, max);
      const p = Math.pow(10, Math.floor(Math.log10(roh)));
      return [1, 2, 4, 5, 10].map(f => f * p).find(s => s >= roh);
    }
    /** Zusammenhaengende Strecken ohne null: [[[i, wert], …], …] */
    function dgStrecken(werte) {
      const teile = []; let akt = null;
      (werte ?? []).forEach((w, i) => {
        if (w === null || w === undefined) { akt = null; return; }
        if (!akt) { akt = []; teile.push(akt); }
        akt.push([i, Number(w) || 0]);
      });
      return teile;
    }
    /** Linie mit 12 Monaten: haupt (durchgezogen, --info), vergleich (gestrichelt, --muted, optional).
     *  laufend = Index des laufenden Monats: dorthin gepunktet mit hohlem Punkt ("bisher" - der Monat ist noch nicht um). */
    function dgLinie({ haupt, vergleich, beschreibung, laufend = null }) {
      const B = 300, R = 10, O = 12, U = 128;
      const NS = ' vector-effect="non-scaling-stroke"';
      const werte = [...(haupt ?? []), ...(vergleich ?? [])].filter(w => w !== null && w !== undefined).map(Number);
      const oben = dgObergrenze(werte.length ? Math.max(...werte) : 0);
      const L = Math.max(30, Math.ceil(12 + 6.5 * dgZahl(oben).length));   // Platz fuer die laengste Achsenzahl ("2.000")
      const x = i => L + i * (B - L - R) / 11;
      const y = w => U - (w / oben) * (U - O);
      const pkt = s => s.map(([i, w]) => `${x(i).toFixed(1)},${y(w).toFixed(1)}`).join(' ');
      let svg = `<svg class="dg-linie" viewBox="0 0 ${B} 160" role="img" aria-label="${dgEsc(beschreibung)}">`;
      for (const v of [0, oben / 2, oben]) {
        svg += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${B - R}" y2="${y(v).toFixed(1)}" style="stroke:var(--border)" stroke-width="1"${v ? ' stroke-dasharray="2 4"' : ''}${NS}/>`
          + `<text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--muted)">${dgZahl(v)}</text>`;
      }
      for (const s of dgStrecken(vergleich)) {
        svg += s.length > 1
          ? `<polyline points="${pkt(s)}" fill="none" style="stroke:var(--muted)" stroke-width="2" stroke-dasharray="5 4"${NS}/>`
          : `<circle cx="${x(s[0][0]).toFixed(1)}" cy="${y(s[0][1]).toFixed(1)}" r="2.5" style="fill:var(--muted)"/>`;
      }
      const lw = laufend !== null && laufend !== undefined && haupt?.[laufend] !== null && haupt?.[laufend] !== undefined ? Number(haupt[laufend]) : null;
      const fest = lw === null ? haupt : (haupt ?? []).map((w, i) => (i === laufend ? null : w));
      const hs = dgStrecken(fest);
      for (const s of hs) {
        svg += s.length > 1
          ? `<polyline points="${pkt(s)}" fill="none" style="stroke:var(--info)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"${NS}/>`
          : `<circle cx="${x(s[0][0]).toFixed(1)}" cy="${y(s[0][1]).toFixed(1)}" r="3" style="fill:var(--info)"/>`;
      }
      const davor = lw !== null && laufend > 0 ? fest[laufend - 1] : null;
      if (lw !== null) {
        if (davor !== null && davor !== undefined) svg += `<line x1="${x(laufend - 1).toFixed(1)}" y1="${y(davor).toFixed(1)}" x2="${x(laufend).toFixed(1)}" y2="${y(lw).toFixed(1)}" style="stroke:var(--info)" stroke-width="2.5" stroke-dasharray="2 4" stroke-linecap="round"${NS}/>`;
        svg += `<circle cx="${x(laufend).toFixed(1)}" cy="${y(lw).toFixed(1)}" r="4.5" style="fill:var(--surface);stroke:var(--info)" stroke-width="2.5"${NS}/>`;
      } else {
        const letzte = hs.length ? hs[hs.length - 1][hs[hs.length - 1].length - 1] : null;
        if (letzte) svg += `<circle cx="${x(letzte[0]).toFixed(1)}" cy="${y(letzte[1]).toFixed(1)}" r="5" style="fill:var(--info)"/>`;
      }
      DG_MONATE.forEach((m, i) => { svg += `<text x="${x(i).toFixed(1)}" y="148" text-anchor="middle" font-size="11" style="fill:var(--muted)">${m[0]}</text>`; });
      return svg + '</svg>';
    }
    /** Waagerechte Balken: [{ name, wert }] - laengster Balken = 100 %. */
    function dgBalken(eintraege) {
      if (!eintraege || !eintraege.length) return '';
      const max = Math.max(...eintraege.map(e => Number(e.wert) || 0)) || 1;
      return '<div class="dg-balken">' + eintraege.map(e => `<span class="dg-balken-name">${dgEsc(e.name)}</span>`
        + `<strong class="dg-balken-zahl">${dgZahl(e.wert)}</strong>`
        + `<span class="dg-balken-spur" aria-hidden="true"><b class="dg-balken-wert" style="width:${Math.max(2, Math.round((Number(e.wert) || 0) / max * 100))}%"></b></span>`).join('') + '</div>';
    }
    /** "8 mehr als im Vorjahr" / "3 weniger …" / "genauso viele …"; ohne Vergleichswert ''. fmt = DG_STUECK | DG_EURO */
    function dgVergleich(wert, vorher, fmt = DG_STUECK) {
      if (vorher === null || vorher === undefined) return '';
      const d = Math.round(((Number(wert) || 0) - Number(vorher)) * 100) / 100;
      if (d > 0) return `${fmt.diff(d)} mehr als im Vorjahr`;
      if (d < 0) return `${fmt.diff(-d)} weniger als im Vorjahr`;
      return fmt === DG_STUECK ? 'genauso viele wie im Vorjahr' : 'genauso viel wie im Vorjahr';
    }
    /** Satz unter der Kurve: letzter ganzer Monat (mit Vorjahr) + laufender Monat bisher. */
    function dgSatzMonat({ jahr, monat, reihe }, fmt = DG_STUECK) {
      const j = reihe?.jahr ?? [], vj = reihe?.vorjahr ?? [];
      if (monat === 0) {
        const dez = vj[11];
        return (dez !== null && dez !== undefined ? `Dezember ${jahr - 1}: ${fmt.wert(dez)}. ` : '') + `Januar bisher: ${fmt.wert(j[0])}.`;
      }
      const m = monat - 1;
      const vergleich = dgVergleich(j[m], vj[m], fmt);
      return `${DG_MONATE[m]}: ${fmt.wert(j[m])}${vergleich ? `, ${vergleich}` : ''}. ${DG_MONATE[monat]} bisher: ${fmt.wert(j[monat])}.`;
    }
    // ── Diagramme: Ende ──

    // ── Partner-Übersicht: Anfang (PD1, wortgleich in partner.html und partner-festpreis.html, Test pd1-frontend.test.js) ──
    // Startseite aus GET …/uebersicht (nur fertige Zahlen, nur Stueck - keine Betraege je Monat): Kacheln Auszahlung · Stueck offen ·
    // Stueck in Pruefung · Stueck im Jahr, darunter Kurve und Top 5. Mouse-over ueber data-tipp, am Handy das ⓘ. Rot nie (Farbregel).
    const puEuro = n => Number(n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    function puSaldo(saldo) {
      if (saldo > 0) return { klasse: 'pu-plus', wort: 'bekommst du noch', betrag: puEuro(saldo) };
      if (saldo < 0) return { klasse: 'pu-minus', wort: 'schuldest du noch', betrag: `−${puEuro(Math.abs(saldo))}` };
      return { klasse: '', wort: 'ausgeglichen', betrag: puEuro(0) };
    }
    const puI = (id, tipp, rechts = true) => `<button type="button" class="pu-i pu-tipp${rechts ? ' pu-rechts' : ''}" data-pu-info="${id}" aria-expanded="false" aria-controls="${id}" aria-label="Was bedeutet das?" data-tipp="${dgEsc(tipp)}">ⓘ</button>`;
    const puInfo = (id, text) => `<p class="pu-info" id="${id}" hidden>${text}</p>`;
    function puJahrVergleich(d, jetzt = d.stueckJahr, vorher = d.stueckVorjahr, fmt = DG_STUECK) {
      if (vorher !== null && vorher !== undefined) {
        const diff = Math.round((jetzt - vorher) * 100) / 100;
        if (diff > 0) return `<span class="pu-chip pu-chip-gut">+${fmt.diff(diff)} zum Vorjahr</span>`;
        if (diff < 0) return `<span class="pu-klein">−${fmt.diff(-diff)} zum Vorjahr</span>`;
        return '<span class="pu-klein">wie im Vorjahr</span>';
      }
      return d.vorjahrDaten ? `<span class="pu-klein">Vorjahr erst ab ${DG_MONATE[d.vorjahrAb] ?? ''}</span>` : '<span class="pu-klein">Vorjahr: keine Daten</span>';
    }
    // PD2: Detailansicht (nur wenn die Antwort `detail` traegt) - Reihe der Kurve umschaltbar, Betraege am Handy erst nach Antippen.
    let puLetzte = null;
    const PU_REIHEN = { stueck: 'Stück', umsatz: 'Umsatz', erloes: 'Erlös' };
    function puKurveInhalt(d, art = 'stueck') {
      const det = d.detail;
      const vj = d.vorjahrDaten;
      const reihe = art === 'stueck' || !det ? d.reihe : det.reihe[art];
      const fmt = art === 'stueck' ? DG_STUECK : DG_EURO;
      const legende = `<p class="pu-legende"><span><i class="pu-strich"></i>${d.jahr}</span><span><i class="pu-punkt"></i>${DG_MONATE[d.monat] ?? ''} bisher</span>`
        + (vj ? `<span><i class="pu-strich pu-vj"></i>${d.jahr - 1}</span>` : '<span>Vorjahr: keine Daten</span>') + '</p>';
      return dgLinie({ haupt: reihe.jahr, vergleich: vj ? reihe.vorjahr : null, laufend: d.monat,
        beschreibung: `${art === 'stueck' ? 'Verkaufte Stück' : `${PU_REIHEN[art]} in Euro`} je Monat ${d.jahr}${vj ? ` im Vergleich zu ${d.jahr - 1}` : ''}` })
        + legende + `<p class="pu-satz">${dgEsc(dgSatzMonat({ jahr: d.jahr, monat: d.monat, reihe }, fmt))}</p>`;
    }
    function puUmschalterHtml() {
      return '<div class="pu-umschalter" role="group" aria-label="Kurve zeigt">'
        + Object.entries(PU_REIHEN).map(([k, n]) => `<button type="button" class="pu-tipp${k === 'stueck' ? '' : ' pu-betrag'}" data-pu-reihe="${k}" aria-pressed="${k === 'stueck'}"`
          + ` data-tipp="${dgEsc(`Kurve: ${n} je Monat`)}">${n}</button>`).join('') + '</div>';
    }
    function puTop10Html(det) {
      const top = det.top10 ?? [];
      if (!top.length) return '<p class="pu-leer">In diesem Jahr ist noch nichts verkauft.</p>';
      return '<ol class="pu-top10">' + top.map(t => `<li><span class="pu-top10-name">${dgEsc(t.name)}</span>`
        + `<span class="pu-top10-zahlen"><strong>${dgZahl(t.stueck)} Stück</strong><span class="pu-betrag"> · Umsatz ${dgEuro(t.umsatz)} · Erlös ${dgEuro(t.erloes)}</span></span></li>`).join('')
        + '</ol>' + `<p class="pu-satz">Am meisten verkauft: ${dgEsc(top[0].name)} (${dgZahl(top[0].stueck)} Stück).</p>`;
    }
    function puHtml(d) {
      const a = d.auszahlung ?? {};
      const seit = a.seit ? `seit ${dgEsc(a.seit)}` : 'seit Beginn';
      const s = puSaldo(Number(a.saldo) || 0);
      const zusatz = [a.intern ? `${dgZahl(a.intern)} direkte Bestellung${a.intern === 1 ? '' : 'en'} abgezogen` : '', a.inPruefung ? 'ein Teil noch in Prüfung' : '']
        .filter(Boolean).join(' · ');
      const ausInfo = `Deine Anteile aus Shop-Verkäufen (inkl. MwSt) minus deine direkten Bestellungen – alles, was noch nicht abgerechnet ist (${seit}). `
        + 'Positiv: das bekommst du noch. Negativ: das schuldest du noch.'
        + (a.internOhneBetrag ? ' Direkte Bestellungen ohne Betrag zählen hier mit 0.' : '')
        + (a.inPruefung ? ' Ein Teil (z. B. Porto oder Verpackung) wird noch geprüft und ist hier noch nicht enthalten.' : '');
      const aus = a.saldoKachel === false ? ''
        : `<div class="pu-kachel pu-aus ${s.klasse}"><span class="pu-label">Offene Auszahlung</span><span class="pu-zahl">${s.betrag}</span>`
          + `<span class="pu-klein">${s.wort} · ${seit}</span>${zusatz ? `<span class="pu-klein">${zusatz}</span>` : ''}`
          + puI('pu-i-aus', 'Wie wird die Auszahlung gerechnet?') + puInfo('pu-i-aus', ausInfo) + '</div>';
      const st = d.stand ?? {};
      const off = `<div class="pu-kachel pu-off pu-tipp" tabindex="0" data-tipp="Verkaufte Stück, die noch nicht abgerechnet sind (ohne die in Prüfung).">`
        + `<span class="pu-zahl">${dgZahl(st.offen)}</span><span class="pu-label">Stück offen</span><span class="pu-klein">noch nicht abgerechnet</span></div>`;
      const pr = `<div class="pu-kachel pu-pr pu-tipp pu-rechts" tabindex="0" data-tipp="Stück, bei denen wir vor der Abrechnung noch etwas klären. Sie zählen erst danach zur Auszahlung.">`
        + `<span class="pu-zahl">${dgZahl(st.inPruefung)}</span><span class="pu-label">Stück in Prüfung</span>`
        + (st.inPruefung ? '<span class="pu-chip pu-chip-warn">wir prüfen noch</span>' : '<span class="pu-klein">nichts in Prüfung</span>') + '</div>';
      const bis = DG_MONATE[d.monat] ?? '';
      const jahr = `<div class="pu-kachel pu-jahr pu-tipp pu-rechts" tabindex="0" data-tipp="${dgEsc(`Verkaufte Stück von Januar bis ${bis} ${d.jahr}, Stornos und Erstattungen abgezogen. Vergleich: derselbe Zeitraum ${d.jahr - 1}.`)}">`
        + `<span class="pu-zahl">${dgZahl(d.stueckJahr)}</span><span class="pu-label">Stück ${d.jahr}</span>${puJahrVergleich(d)}</div>`;
      const ohne = d.ohneVerkaeufe || !Array.isArray(d.reihe?.jahr) || !d.reihe.jahr.length;   // auch ohne Reihe: Satz statt leerer Achse
      const det = d.detail ?? null;
      puLetzte = d;
      const kurve = `<section class="pu-karte pu-kurve"><div class="pu-kopf"><h2>Verkäufe ${d.jahr}${det ? '' : ' (Stück)'}</h2>`
        + puI('pu-i-kurve', det ? 'Stück, Umsatz oder Erlös je Monat, Stornos abgezogen. Gestrichelt: das Vorjahr.' : 'Verkaufte Stück je Monat, Stornos abgezogen. Gestrichelt: das Vorjahr.') + '</div>'
        + puInfo('pu-i-kurve', 'Jeder Punkt ist ein Monat: verkaufte Stück aus Bestellungen dieses Monats. Stornos und Erstattungen zählen im Monat der Bestellung und sind abgezogen. Die gestrichelte Linie zeigt das Vorjahr, soweit es Daten gibt.'
          + (det ? ' Umsatz: was Kunden für deine Artikel bezahlt haben (brutto, nach Rabatt und Gutschein, ohne Porto). Erlös: Umsatz minus Festpreis, Handling und Mehrkosten (brutto) – Porto, PayPal und Verpackung rechnet die Abrechnung.' : ''))
        + (ohne
          ? '<p class="pu-leer">Sobald die ersten Artikel verkauft sind, siehst du hier deine Verkäufe je Monat.</p>'
          : (det ? puUmschalterHtml() : '') + `<div class="pu-kurve-inhalt" id="pu-kurve-inhalt">${puKurveInhalt(d)}</div>`)
        + '</section>';
      if (det) {
        const top10 = `<section class="pu-karte pu-top"><div class="pu-kopf"><h2>Top 10 in diesem Jahr</h2>`
          + puI('pu-i-top', 'Deine zehn meistverkauften Artikel seit Januar: Stück, Umsatz und Erlös.') + '</div>'
          + puInfo('pu-i-top', 'Sortiert nach Stück seit dem 1. Januar, Stornos und Erstattungen abgezogen. Umsatz und Erlös brutto wie oben. Heißt ein Artikel im Shop inzwischen anders, kann er zweimal auftauchen.')
          + puTop10Html(det) + '</section>';
        const ums = `<div class="pu-kachel pu-ums pu-betrag pu-tipp" tabindex="0" data-tipp="Was Kunden für deine Artikel bezahlt haben (brutto, nach Rabatt und Gutschein, ohne Porto), Stornos und Erstattungen abgezogen.">`
          + `<span class="pu-zahl">${dgEuro(det.umsatzJahr)}</span><span class="pu-label">Umsatz ${d.jahr}</span>${puJahrVergleich(d, det.umsatzJahr, det.umsatzVorjahr, DG_EURO)}</div>`;
        const erl = `<div class="pu-kachel pu-erl pu-betrag pu-tipp pu-rechts" tabindex="0" data-tipp="Was dir von deinen Artikeln bleibt: Umsatz minus Festpreis, Handling und Mehrkosten (brutto). Porto, PayPal und Verpackung rechnet die Abrechnung.">`
          + `<span class="pu-zahl">${dgEuro(det.erloesJahr)}</span><span class="pu-label">Erlös ${d.jahr}</span>${puJahrVergleich(d, det.erloesJahr, det.erloesVorjahr, DG_EURO)}</div>`;
        const knopf = '<button type="button" class="pu-betraege-knopf pu-tipp" data-pu-betraege aria-expanded="false" data-tipp="Umsatz und Erlös auf diesem Gerät einblenden">Beträge zeigen</button>';
        return `<div class="pu-raster pu-mit-detail pu-betraege-aus${a.saldoKachel === false ? ' pu-ohne-saldo' : ''}">${knopf}${aus}${off}${pr}${jahr}${ums}${erl}${kurve}${top10}</div>`;
      }
      const top5 = d.top5 ?? [];
      const top = `<section class="pu-karte pu-top"><div class="pu-kopf"><h2>Top 5 in diesem Jahr</h2>`
        + puI('pu-i-top', 'Deine fünf meistverkauften Artikel seit Januar, nach Stück.') + '</div>'
        + puInfo('pu-i-top', 'Gezählt werden verkaufte Stück seit dem 1. Januar, Stornos und Erstattungen abgezogen. Heißt ein Artikel im Shop inzwischen anders, kann er zweimal auftauchen.')
        + (top5.length
          ? dgBalken(top5.map(t => ({ name: t.name, wert: t.stueck })))
            + `<p class="pu-satz">Am meisten verkauft: ${dgEsc(top5[0].name)} (${dgZahl(top5[0].stueck)} Stück).</p>`
          : '<p class="pu-leer">In diesem Jahr ist noch nichts verkauft.</p>')
        + '</section>';
      return `<div class="pu-raster${a.saldoKachel === false ? ' pu-ohne-saldo' : ''}">${aus}${off}${pr}${jahr}${kurve}${top}</div>`;
    }
    function puLadeHtml() {
      return '<div class="pu-raster" aria-busy="true">'
        + ['pu-aus', 'pu-off', 'pu-pr', 'pu-jahr'].map(k => `<div class="skeleton ${k}" style="height:96px;"></div>`).join('')
        + '<div class="skeleton pu-kurve" style="height:220px;"></div><div class="skeleton pu-top" style="height:220px;"></div></div>';
    }
    function puFehlerHtml() {
      return '<p class="pu-leer">Übersicht gerade nicht verfügbar – die Details stehen darunter.</p>';
    }
    document.addEventListener('click', ev => {
      const r = ev.target.closest ? ev.target.closest('[data-pu-reihe]') : null;
      if (r && puLetzte) {
        document.querySelectorAll('[data-pu-reihe]').forEach(k => k.setAttribute('aria-pressed', String(k === r)));
        const ziel = document.getElementById('pu-kurve-inhalt');
        if (ziel) ziel.innerHTML = puKurveInhalt(puLetzte, r.dataset.puReihe);
        return;
      }
      const bt = ev.target.closest ? ev.target.closest('[data-pu-betraege]') : null;
      if (bt) {
        const raster = bt.closest('.pu-raster');
        const zu = raster.classList.toggle('pu-betraege-aus');
        bt.setAttribute('aria-expanded', String(!zu));
        bt.textContent = zu ? 'Beträge zeigen' : 'Beträge ausblenden';
        if (zu && puLetzte) {   // ausgeblendet: Kurve zurueck auf Stueck
          document.querySelectorAll('[data-pu-reihe]').forEach(k => k.setAttribute('aria-pressed', String(k.dataset.puReihe === 'stueck')));
          const ziel = document.getElementById('pu-kurve-inhalt');
          if (ziel) ziel.innerHTML = puKurveInhalt(puLetzte, 'stueck');
        }
        return;
      }
      const b = ev.target.closest ? ev.target.closest('[data-pu-info]') : null;
      if (!b) return;
      const p = document.getElementById(b.dataset.puInfo);
      if (!p) return;
      p.hidden = !p.hidden;
      b.setAttribute('aria-expanded', String(!p.hidden));
    });
    // ── Partner-Übersicht: Ende ──

// ── Partner-Kacheln: Anfang (wortgleich in index.html und partner.html, Test partner-kacheln.test.js) ──
    // PP1: Startkacheln eines Lizenzpartners aus GET /api/partner/kacheln bzw. /api/kalkulation/partner/:id/kacheln.
    // Saldo > 0 = bekommt noch (gruen), < 0 = schuldet noch (rot). saldoKachel false (Partner-Spalte Saldo_Kachel = nein) -> ohne Saldo.
    const pkEuro = n => Number(n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    const pkEsc = x => String(x ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    function pkSaldoText(saldo) {
      if (saldo > 0) return { klasse: 'pk-plus', wort: 'bekommst du noch', betrag: pkEuro(saldo) };
      if (saldo < 0) return { klasse: 'pk-minus', wort: 'schuldest du noch', betrag: `−${pkEuro(Math.abs(saldo))}` };
      return { klasse: '', wort: 'ausgeglichen', betrag: pkEuro(0) };
    }
    function pkKachelnHtml(k) {
      const seit = k.seit ? `seit ${pkEsc(k.seit)}` : 'seit Beginn';
      const s = pkSaldoText(k.saldo);
      const ohne = k.internOhneBetrag ? `<span class="pk-klein">${k.internOhneBetrag} ohne Betrag</span>` : '';
      return '<div class="pk-raster">'
        + `<button type="button" class="pk-kachel" data-pk-ziel="verkaeufe" data-hilfe="pk-bestellungen"><span class="pk-zahl">${Number(k.bestellungen) || 0}</span><span class="pk-label">Bestellungen</span><span class="pk-klein">${seit}</span></button>`
        + `<button type="button" class="pk-kachel" data-pk-ziel="intern" data-hilfe="pk-intern"><span class="pk-zahl">${Number(k.intern) || 0}</span><span class="pk-label">Interne Bestellungen</span>${ohne}</button>`
        + (k.saldoKachel === false ? ''
          : `<button type="button" class="pk-kachel pk-saldo ${s.klasse}" data-pk-ziel="saldo" data-hilfe="pk-saldo"><span class="pk-zahl">${s.betrag}</span><span class="pk-label">Saldo · ${s.wort}</span><span class="pk-klein">${seit}</span></button>`)
        + '<button type="button" class="pk-kachel pk-details" data-pk-ziel="details" data-hilfe="pk-details"><span class="pk-zahl">›</span><span class="pk-label">Details</span></button>'
        + '</div>'
        + (k.saldoKachel === false ? '' : '<div class="pk-info-zeile"><button type="button" class="pk-info-knopf" data-pk-info aria-expanded="false" aria-label="Wie wird der Saldo gerechnet?" data-hilfe="pk-info">ⓘ</button>'
          + `<p class="pk-info" hidden>Saldo = deine Lizenzanteile aus Shop-Verkäufen (inkl. MwSt) minus deine internen Bestellungen – alles, was noch nicht abgerechnet ist (${seit}). `
          + `Positiv: das bekommst du noch. Negativ: das schuldest du noch.${k.internOhneBetrag ? ' Interne Bestellungen ohne Betrag zählen hier mit 0.' : ''}</p></div>`);
    }
    // ── Partner-Kacheln: Ende ──

    function showError(msg) {
      main.innerHTML = `
        <div class="error-box" style="max-width:480px;margin:3rem auto;">
          <p>${msg}</p>
        </div>`;
    }

    // ── Verkäufe laden & rendern (PP3: nur Offenes, Schalter "auch abgerechnete") ──
    async function loadVerkaeufe() {
      const wrap = document.getElementById('pv-verkaeufe');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton"></div>';
      try {
        plDaten.verkaeufe = await apiGet('/api/partner/verkaeufe');
        renderVerkaeufe();
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${plEsc(e.message)}</p>`;
      }
    }
    function renderVerkaeufe() {
      const wrap = document.getElementById('pv-verkaeufe');
      if (!wrap || !plDaten.verkaeufe) return;
      const rows = plDaten.verkaeufe;
      if (!rows.length) { wrap.innerHTML = '<p class="empty">Noch keine Verkäufe vorhanden.</p>'; return; }
      const sicht = plSicht(rows, plLies(plSpeicher()));
      const spalten = [{ titel: 'Bestellnummer', rolle: 'neben' }, { titel: 'Artikel', rolle: 'haupt' }, { titel: 'Menge', rolle: 'betrag', num: true },
        { titel: 'Datum', rolle: 'datum' }, { titel: 'Status Abrechnung', rolle: 'status' }];
      const zeilen = sicht.zeilen.map(r => {
        const storno = !!r.storno || r.stueckzahl < 0;
        return { storno, zellen: [plEsc(r.orderId), `${plEsc(r.artikelname)}${storno ? ' <span class="pl-rot pl-klein">↩ Storno</span>' : ''}`,
          `<span class="${storno ? 'pl-rot' : ''}">${plEsc(r.stueckzahl)}</span>`, plEsc(r.datum), `<span class="badge ${badgeClass(r.status)}">${plEsc(r.status)}</span>`] };
      });
      wrap.innerHTML = plKopfHtml(sicht) + plTabelleHtml(spalten, zeilen, 'Seit der letzten Abrechnung noch keine Verkäufe.');
    }

    // ── Direkte Bestellungen laden & rendern (PP3: nur Offenes) ──
    async function loadIntern() {
      const wrap = document.getElementById('pv-intern');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton"></div>';
      try {
        plDaten.intern = await apiGet('/api/partner/intern');
        renderIntern();
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${plEsc(e.message)}</p>`;
      }
    }
    function renderIntern() {
      const wrap = document.getElementById('pv-intern');
      if (!wrap || !plDaten.intern) return;
      const rows = plDaten.intern;
      if (!rows.length) { wrap.innerHTML = '<p class="empty">Keine direkten Bestellungen vorhanden.</p>'; return; }
      const sicht = plSicht(rows, plLies(plSpeicher()));
      const spalten = [{ titel: 'Datum', rolle: 'datum' }, { titel: 'Bezeichnung', rolle: 'haupt' }, { titel: 'Anzahl', rolle: 'neben', num: true },
        { titel: 'Einzelpreis brutto', rolle: 'neben', num: true }, { titel: 'Summe', rolle: 'betrag', num: true }, { titel: 'Status Abrechnung', rolle: 'status' }];
      const zeilen = sicht.zeilen.map(r => ({ zellen: [plEsc(r.datum), plEsc(r.bezeichnung), plEsc(r.anzahl), fmt(r.einzelpreis), `<strong>${fmt(r.summe)}</strong>`,
        `<span class="badge ${badgeClass(r.status)}">${plEsc(r.status)}</span>`] }));
      wrap.innerHTML = plKopfHtml(sicht) + plTabelleHtml(spalten, zeilen, 'Seit der letzten Abrechnung keine direkten Bestellungen.');
    }

    // ── Saldo laden & rendern ────────────────────────────────────────────────
    async function loadSaldo() {
      const wrap = document.getElementById('pv-saldo');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton" style="height:120px;"></div>';
      try {
        const data = await apiGet('/api/partner/saldo');
        const positiv  = data.saldo >= 0;
        const label    = positiv ? 'Aktuelles Guthaben (brutto)' : 'Aktueller Rückstand (brutto)';
        const colorCls = positiv ? 'saldo-positive' : 'saldo-negative';
        const lizenzNetto  = data.lizenzNetto ?? data.lizenzSumme ?? 0;
        const lizenzBrutto = data.lizenzBrutto ?? lizenzNetto;
        wrap.innerHTML = `
          <div class="saldo-row">
            <span>Verkäufe (Lizenz) netto</span>
            <span class="amount saldo-positive">+${fmt(lizenzNetto)}</span>
          </div>
          <div class="saldo-row muted">
            <span>zzgl. MwSt (${plEsc(data.mwstProzent ?? 0)} %)</span>
            <span class="amount">+${fmt(lizenzBrutto - lizenzNetto)}</span>
          </div>
          <div class="saldo-row">
            <span>Verkäufe (Lizenz) brutto</span>
            <span class="amount saldo-positive">+${fmt(lizenzBrutto)}</span>
          </div>
          <div class="saldo-row">
            <span>Direkte Bestellungen (brutto)</span>
            <span class="amount saldo-negative">−${fmt(data.interneSumme)}</span>
          </div>
          <hr class="saldo-divider">
          <div class="saldo-row saldo-final">
            <span>${label}</span>
            <span class="amount ${colorCls}">${positiv ? '' : '−'}${fmt(Math.abs(data.saldo))}</span>
          </div>
          <p class="saldo-row muted" style="padding-top:0.6rem;">
            Nur offene, noch nicht abgerechnete Positionen${data.saldoNetto !== undefined ? ` · entspricht netto ${fmt(data.saldoNetto)}` : ''}.
          </p>`;
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${plEsc(e.message)}</p>`;
      }
    }

    // ── Abrechnungen laden & rendern ─────────────────────────────────────────
    // Partner sieht nur freigegebene + bezahlte Abrechnungen (Entwürfe sind ausgeblendet).
    async function loadAbrechnungen() {
      const wrap = document.getElementById('pv-abrechnungen');
      if (!wrap) return;
      wrap.innerHTML = '<div class="skeleton"></div>';
      try {
        const rows = await apiGet('/api/partner/abrechnungen');
        plAnzahlSetzen(rows.length);   // PP3
        if (!rows.length) { wrap.innerHTML = '<p class="empty">Noch keine Abrechnungen vorhanden.</p>'; return; }
        const sumBezahlt = rows.filter(r => r.status === 'bezahlt').reduce((s, r) => s + r.saldo, 0);

        // Sortierung: neueste zuerst
        rows.sort((a, b) => (b.erstelltAm || '').localeCompare(a.erstelltAm || ''));

        wrap.innerHTML = `
          <p class="summary">
            ${rows.length} Abrechnung(en) &nbsp;·&nbsp;
            Bereits ausgezahlt: <strong>${fmt(sumBezahlt)}</strong>
          </p>
          ${rows.map(r => renderAbrechnungBlock(r)).join('')}`;
      } catch (e) {
        wrap.innerHTML = `<p style="color:var(--danger);font-size:0.88rem;">Fehler: ${plEsc(e.message)}</p>`;
      }
    }

    function renderAbrechnungBlock(r) {
      const p = r.positionen || { verkaeufe: [], intern: [] };
      const isPos = r.saldo >= 0;
      const summeCls = isPos ? 'pos' : 'neg';
      const summeSign = isPos ? '' : '−';

      // PP3: dieselbe Tabelle wie oben (am Handy Karten)
      const verkaeufeTabelle = plTabelleHtml(
        [{ titel: 'Datum', rolle: 'datum' }, { titel: 'Bestellnr.', rolle: 'neben' }, { titel: 'Artikel', rolle: 'haupt' }, { titel: 'Menge', rolle: 'neben', num: true },
          { titel: 'VK Netto', rolle: 'neben', num: true }, { titel: 'Lizenz', rolle: 'betrag', num: true }],
        (p.verkaeufe || []).map(v => ({ zellen: [plEsc(v.datum), plEsc(v.orderId), plEsc(v.artikelname), plEsc(v.stueckzahl), fmt(v.vkBrutto), `<strong>${fmt(v.lizenz)}</strong>`] })),
        'Keine Verkäufe');
      const internBlock = (p.intern && p.intern.length) ? `
        <h3>Direkte Bestellungen</h3>
        ${plTabelleHtml([{ titel: 'Datum', rolle: 'datum' }, { titel: 'Bezeichnung', rolle: 'haupt' }, { titel: 'Anzahl', rolle: 'neben', num: true }, { titel: 'Summe', rolle: 'betrag', num: true }],
          p.intern.map(i => ({ zellen: [plEsc(i.datum), plEsc(i.bezeichnung), plEsc(i.anzahl), fmt(i.summe)] })), '')}` : '';

      const lizenzNetto  = (p.verkaeufe || []).reduce((s, v) => s + (v.lizenz || 0), 0);
      const interneSumme = (p.intern    || []).reduce((s, v) => s + (v.summe  || 0), 0);
      const mwst         = p.mwstProzent ?? 0;
      const lizenzBrutto = p.lizenzBrutto ?? (lizenzNetto * (1 + mwst / 100));
      const mwstRow = mwst ? `
            <div class="saldo-row muted">
              <span>zzgl. MwSt (${plEsc(mwst)} %)</span>
              <span class="amount">+${fmt(lizenzBrutto - lizenzNetto)}</span>
            </div>` : '';

      return `
        <div class="abr-card">
          <div class="abr-header">
            <div>
              <strong>${plEsc(r.abrechnungId)}</strong>
              <span class="abr-zeitraum">&nbsp;·&nbsp;${plEsc(r.zeitraumVon)} – ${plEsc(r.zeitraumBis)}</span>
              <span class="badge ${badgeClass(r.status)}" style="margin-left:0.5rem;">${plEsc(r.status)}</span>
            </div>
            <div class="abr-summe ${summeCls}">${summeSign}${fmt(Math.abs(r.saldo))}</div>
          </div>

          <h3>Verkäufe (${(p.verkaeufe || []).length})</h3>
          ${verkaeufeTabelle}

          ${internBlock}

          <div style="margin-top:1rem;padding:0.85rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;max-width:480px;">
            <div class="saldo-row">
              <span>Lizenz-Summe netto</span>
              <span class="amount saldo-positive">+${fmt(lizenzNetto)}</span>
            </div>
            ${mwstRow}
            <div class="saldo-row">
              <span>Lizenz-Summe brutto</span>
              <span class="amount saldo-positive">+${fmt(lizenzBrutto)}</span>
            </div>
            <div class="saldo-row">
              <span>Direkte Bestellungen (brutto)</span>
              <span class="amount saldo-negative">−${fmt(interneSumme)}</span>
            </div>
            <hr class="saldo-divider">
            <div class="saldo-row saldo-final">
              <span>${r.status === 'bezahlt' ? 'Ausgezahlt (brutto)' : 'Auszahlung (brutto)'}</span>
              <span class="amount ${isPos ? 'saldo-positive' : 'saldo-negative'}">${summeSign}${fmt(Math.abs(r.saldo))}</span>
            </div>
          </div>
        </div>`;
    }

    // ── Eigenauftrag stellen ─────────────────────────────────────────────────
    function initEigenauftrag() {
      const form = document.getElementById('ea-form');
      if (!form) return;
      const adresse = document.getElementById('ea-adresse');
      form.querySelectorAll('input[name="ea-liefer"]').forEach(r => {
        r.addEventListener('change', () => {
          const abw = form.querySelector('input[name="ea-liefer"]:checked').value === 'abweichend';
          adresse.style.display = abw ? 'flex' : 'none';
        });
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('ea-msg');
        msg.className = ''; msg.textContent = '';

        const artikel   = document.getElementById('ea-artikel').value.trim();
        const menge     = document.getElementById('ea-menge').value;
        const varianten = document.getElementById('ea-varianten').value.trim();
        if (!artikel || !menge || !varianten) {
          msg.className = 'ea-msg-err';
          msg.textContent = 'Bitte Artikel, Menge und Varianten ausfüllen.';
          return;
        }

        const payload = {
          artikel, menge: Number(menge), varianten,
          lieferTyp:     form.querySelector('input[name="ea-liefer"]:checked').value,
          lieferName:    document.getElementById('ea-name').value.trim(),
          lieferStrasse: document.getElementById('ea-strasse').value.trim(),
          lieferPlzOrt:  document.getElementById('ea-plzort').value.trim(),
          wunschtermin:  document.getElementById('ea-termin').value,
          anmerkungen:   document.getElementById('ea-anmerkungen').value.trim(),
        };

        const btn = document.getElementById('ea-submit');
        btn.disabled = true;
        try {
          await apiPost(`/api/partner/${encodeURIComponent(PARTNER_ID)}/eigenauftrag`, payload);
          msg.className = 'ea-msg-ok';
          msg.textContent = 'Dein Auftrag wurde übermittelt.';
          form.reset();
          adresse.style.display = 'none';
        } catch (err) {
          msg.className = 'ea-msg-err';
          msg.textContent = `Fehler: ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      });
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      const shopLabel = SHOP === 'honk' ? 'HonkShop' : 'JammiFashion';
      document.getElementById('shop-logo').textContent = `${shopLabel} – Partner Portal`;
      if (!TOKEN) { showError('Kein Token in der URL.<br>Bitte nutze den Link deines Ansprechpartners bei JammiFashion.'); return; }

      main.innerHTML = '<div class="skeleton" style="height:60px;border-radius:8px;"></div>';
      try {
        const me = await apiGet('/api/partner/auth');
        PARTNER_ID = me.partnerId || '';
        document.getElementById('partner-name-header').textContent = me.partnerName;
        document.title = `${me.partnerName} – JammiFashion Partner Portal`;
      } catch (e) {
        if (e.status === 401 || e.status === 403)
          showError('Kein Zugang.<br>Dein Token ist ungültig oder dein Konto wurde deaktiviert.');
        else showError(`Fehler beim Laden: ${plEsc(e.message)}`);
        return;
      }

      // PD1: zuerst die Uebersicht (Kacheln, Kurve, Top 5); die bisherigen Karten stehen unveraendert unter "Details" (eingeklappt,
      // geladen erst beim Aufklappen - spart Lesungen beim Seitenaufruf).
      main.innerHTML = `
        <div id="pv-uebersicht">${puLadeHtml()}</div>
        <details class="pu-details" id="pv-details-box">
          <summary>Details: Verkäufe, direkte Bestellungen, Abrechnungen</summary>
          <div class="pu-details-inhalt" id="pv-details">
        <div class="card">
          <div class="card-header">
            <h2>Meine Verkäufe</h2>
            <button class="btn-outline" id="btn-refresh-verkaeufe">↻ Aktualisieren</button>
          </div>
          <div id="pv-verkaeufe"><div class="skeleton"></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Direkte Bestellungen</h2>
          </div>
          <div id="pv-intern"><div class="skeleton"></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Eigenauftrag stellen</h2>
          </div>
          <form id="ea-form" class="ea-form">
            <div id="ea-msg"></div>
            <label class="ea-label">Artikel / Produkt *
              <input class="ea-input" id="ea-artikel" type="text" required>
            </label>
            <label class="ea-label">Menge *
              <input class="ea-input" id="ea-menge" type="number" min="1" step="1" required>
            </label>
            <label class="ea-label">Größen / Varianten *
              <input class="ea-input" id="ea-varianten" type="text" placeholder="z.B. 5x S, 10x M, 3x XL" required>
            </label>
            <fieldset class="ea-fieldset">
              <legend>Lieferadresse</legend>
              <label class="ea-radio"><input type="radio" name="ea-liefer" value="mich" checked> An mich</label>
              <label class="ea-radio"><input type="radio" name="ea-liefer" value="abweichend"> Abweichende Adresse</label>
              <div id="ea-adresse" class="ea-adresse" style="display:none;">
                <input class="ea-input" id="ea-name" type="text" placeholder="Name">
                <input class="ea-input" id="ea-strasse" type="text" placeholder="Straße & Hausnummer">
                <input class="ea-input" id="ea-plzort" type="text" placeholder="PLZ & Ort">
              </div>
            </fieldset>
            <label class="ea-label">Wunschtermin
              <input class="ea-input" id="ea-termin" type="date">
            </label>
            <label class="ea-label">Anmerkungen
              <textarea class="ea-input" id="ea-anmerkungen" rows="3"></textarea>
            </label>
            <button class="btn" type="submit" id="ea-submit">Eigenauftrag absenden</button>
          </form>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Saldo (offene Posten)</h2>
          </div>
          <div id="pv-saldo"><div class="skeleton" style="height:120px;"></div></div>
        </div>
        <details class="card pl-abschnitt" id="pv-abr-box">
          <summary class="card-header"><h2>Meine Abrechnungen <span class="pl-anzahl" id="pv-abr-anzahl"></span></h2></summary>
          <div id="pv-abrechnungen"><div class="skeleton"></div></div>
        </details>
          </div>
        </details>`;
      plAbschnittOeffnen();   // PP3
      ladeUebersicht();
      document.getElementById('pv-details-box').addEventListener('toggle', ev => { if (ev.target.open) detailsLaden(); });

      document.getElementById('btn-refresh-verkaeufe').addEventListener('click', () => {
        loadVerkaeufe();
        loadIntern();
        loadSaldo();
      });

      initEigenauftrag();
    }

    // PD1: Uebersicht laden (eine Anfrage); faellt sie aus, gehen die Details auf.
    async function ladeUebersicht() {
      const wrap = document.getElementById('pv-uebersicht');
      try {
        wrap.innerHTML = puHtml(await apiGet('/api/partner/uebersicht'));
      } catch (e) {
        wrap.innerHTML = puFehlerHtml();
        document.getElementById('pv-details-box').open = true;
      }
    }
    // Details erst beim ersten Aufklappen laden.
    let detailsGeladen = false;
    function detailsLaden() {
      if (detailsGeladen) return;
      detailsGeladen = true;
      loadVerkaeufe(); loadIntern(); loadSaldo(); loadAbrechnungen();
    }

    init();
  </script>
</body>
</html>
