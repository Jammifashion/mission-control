  <title>Bestellseite – JammiFashion</title>
  <script>
    // KS1: Token sofort aus der Adresse nehmen (vor allem anderen), danach nur sessionStorage dieses Tabs.
    // ── Bestellseite-Token: Anfang (reine Logik, Test backend/tests/bestellseite-seite.test.js) ──
    var BS_TOKEN_MUSTER = /^[A-Za-z0-9_-]{43}$/;
    /** Token aus #t=… (bevorzugt, geht nie an den Server) oder ?t=… */
    function bsTokenAusAdresse(hash, suche) {
      var m = /(?:^#|&)t=([^&]+)/.exec(String(hash || '')) || /(?:^\?|&)t=([^&]+)/.exec(String(suche || ''));
      var tok = m ? decodeURIComponent(m[1]) : '';
      return BS_TOKEN_MUSTER.test(tok) ? tok : '';
    }
    /** Liest den Token einmal, legt ihn in den Speicher und entfernt ihn aus der Adresse. -> Token oder '' */
    function bsTokenUebernehmen(win, speicher) {
      var tok = bsTokenAusAdresse(win.location.hash, win.location.search);
      var hatteTeil = /(?:^#|&)t=/.test(win.location.hash || '') || /(?:^\?|&)t=/.test(win.location.search || '');
      if (hatteTeil && win.history && win.history.replaceState) win.history.replaceState(null, '', win.location.pathname);
      try {
        if (tok && speicher) speicher.setItem('bs_token', tok);
        var gespeichert = speicher ? speicher.getItem('bs_token') : '';
        return tok || (BS_TOKEN_MUSTER.test(gespeichert || '') ? gespeichert : '');
      } catch (e) { return tok; }
    }
    // ── Bestellseite-Token: Ende ──
    var BS_TOKEN = '';
    try { BS_TOKEN = bsTokenUebernehmen(window, window.sessionStorage); } catch (e) { BS_TOKEN = bsTokenUebernehmen(window, null); }

    // Farbdarstellung wie das Partnerportal (eigener Schluessel bs_theme), vor dem ersten Zeichnen.
    var BS_THEME_WAHLEN = ['system', 'light', 'dark'];
    function bsThemeLies(speicher) {
      try { var w = speicher ? speicher.getItem('bs_theme') : null; return BS_THEME_WAHLEN.indexOf(w) >= 0 ? w : 'system'; } catch (e) { return 'system'; }
    }
    function bsThemeModus(wahl, matchMedia) {
      if (wahl === 'light' || wahl === 'dark') return wahl;
      try { return matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { return 'dark'; }
    }
    (function () {
      var speicher = null;
      try { speicher = window.localStorage; } catch (e) { speicher = null; }
      var mm = window.matchMedia ? window.matchMedia.bind(window) : null;
      var wahl = bsThemeLies(speicher);
      var anwenden = function () {
        document.documentElement.setAttribute('data-theme', bsThemeModus(wahl, mm));
        document.documentElement.setAttribute('data-theme-wahl', wahl);
        var m = document.querySelector('meta[name="theme-color"]');
        var bg = window.getComputedStyle ? window.getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() : '';
        if (m && bg) m.setAttribute('content', bg);
      };
      anwenden();
      window.bsTheme = {
        wahl: function () { return wahl; },
        setze: function (neu) {
          wahl = BS_THEME_WAHLEN.indexOf(neu) >= 0 ? neu : 'system';
          try { if (speicher) { if (wahl === 'system') speicher.removeItem('bs_theme'); else speicher.setItem('bs_theme', wahl); } } catch (e) { /* gesperrt */ }
          anwenden();
        },
      };
      try {
        var q = mm && mm('(prefers-color-scheme: light)');
        var folge = function () { if (wahl === 'system') anwenden(); };
        if (q && q.addEventListener) q.addEventListener('change', folge); else if (q && q.addListener) q.addListener(folge);
      } catch (e) { /* aelterer Browser */ }
      document.addEventListener('DOMContentLoaded', anwenden);
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; min-height: 100vh; overflow-x: hidden; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.8rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }

    .theme-schalter button { background: none; border: none; color: var(--muted); font: inherit; font-size: 0.8rem; min-width: 40px; min-height: 36px; padding: 0 0.55rem; border-radius: 999px; cursor: pointer; }
    .theme-schalter button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    main { max-width: 860px; margin: 0 auto; padding: 0.8rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 0.9rem; min-width: 0; }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.55rem; }
    .bs-hinweis { line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
    .bs-klein { color: var(--muted); font-size: 0.84rem; line-height: 1.45; }
    .bs-feld { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.84rem; color: var(--muted); min-width: 0; }
    .bs-feld input, .bs-feld select, .bs-feld textarea, .bs-suche, .bs-menge {
      min-height: 44px; padding: 0.45rem 0.65rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 1rem; min-width: 0; width: 100%; }
    .bs-reihe { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
    .bs-reihe > * { flex: 1 1 9rem; }
    .btn, .btn-ruhig { border-radius: 8px; min-height: 44px; padding: 0.5rem 1rem; font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn { background: var(--accent); color: var(--accent-text); border: none; }
    .btn-ruhig { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
    .btn:disabled, .btn-ruhig:disabled { opacity: 0.5; cursor: not-allowed; }
    .bs-link { color: var(--text); background: none; border: none; font: inherit; text-decoration: underline; cursor: pointer; padding: 0.3rem 0.2rem; min-height: 36px; }
    /* Termine */
    .bs-termine { display: flex; flex-direction: column; gap: 0.45rem; }
    .bs-termin { display: flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; align-items: baseline; text-align: left; width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; min-height: 48px; }
    .bs-termin[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .bs-termin.vorbei { opacity: 0.65; }
    .bs-termin strong { font-size: 0.98rem; }

    .bs-banner { border: 1px solid var(--warning); background: var(--warning-bg); border-radius: 8px; padding: 0.6rem 0.75rem; line-height: 1.45; }
    /* Eintragen */
    .bs-tabs { display: flex; gap: 0.3rem; margin-bottom: 0.7rem; }
    .bs-tabs button { flex: 1 1 0; min-height: 44px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 8px; font: inherit; cursor: pointer; }
    .bs-tabs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); font-weight: 600; }
    .bs-filter { display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.3rem; margin-bottom: 0.5rem; scrollbar-width: thin; }

    .bs-filter button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); font-weight: 600; }
    .bs-liste { display: flex; flex-direction: column; gap: 0.45rem; }
    .bs-zeile { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); min-width: 0; }
    .bs-zeile-kopf { display: flex; gap: 0.6rem; align-items: center; width: 100%; padding: 0.45rem 0.55rem; text-align: left; background: none; border: none; color: var(--text); font: inherit; cursor: pointer; min-height: 52px; }
    .bs-thumb { width: 60px; height: 60px; flex: none; border-radius: 6px; object-fit: cover; background: var(--bg); }
    .bs-zeile-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; flex: 1 1 auto; }
    .bs-name { font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
    .bs-farbe { color: var(--muted); font-size: 0.84rem; overflow-wrap: anywhere; }
    .bs-groessen { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .bs-gr { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; padding: 0.1rem 0.4rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
    .bs-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: 0.45rem; padding: 0 0.55rem 0.6rem; }
    .bs-raster label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.82rem; min-width: 0; }
    .bs-raster-fuss { display: flex; gap: 0.5rem; padding: 0 0.55rem 0.6rem; flex-wrap: wrap; align-items: center; }
    .bs-punkt { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--muted); flex: none; }
    .bs-punkt.lieferbar { background: var(--success); }
    .bs-punkt.knapp { background: var(--warning); }
    .bs-punkt.auslauf { background: var(--info); }
    .bs-punkt.weg { background: var(--danger); }
    .bs-besorgen { font-size: 0.78rem; color: var(--muted); font-style: italic; }
    .bs-legende { display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; font-size: 0.78rem; color: var(--muted); }   /* KS2-2: oben ueber der Liste */
    .bs-legende span { display: inline-flex; align-items: center; gap: 0.3rem; }
    /* Korb und Liste */
    .bs-korb { position: sticky; bottom: 0; z-index: 5; border: 1px solid var(--accent); }
    .bs-pos { display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; min-width: 0; }
    .bs-pos:last-child { border-bottom: none; }
    .bs-pos span { overflow-wrap: anywhere; min-width: 0; }
    .bs-weg { flex: none; min-width: 44px; min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; }
    .bs-eintrag { border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.65rem; background: var(--surface-2); display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .bs-eintrag.storniert { opacity: 0.6; }
    .bs-eintrag.storniert .bs-was { text-decoration: line-through; }
    .bs-eintrag-kopf { display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; align-items: baseline; }
    .bs-was { font-weight: 600; overflow-wrap: anywhere; }
    .bs-chip { display: inline-block; padding: 0 0.45rem; border-radius: 999px; border: 1px solid var(--border); font-size: 0.76rem; }
    .bs-spaet { border-color: var(--warning); color: var(--warning); }
    .bs-eintrag-knoepfe { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    /* KS4: Stand je Eintrag - aktueller Schritt als Chip, Tippen zeigt alle Schritte; orange = Hinweis, nie rot */
    .bs-fort summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; min-height: 32px; }
    .bs-fort summary::-webkit-details-marker { display: none; }
    .bs-fort summary .bs-chip { border-color: var(--info); color: var(--info); }
    .bs-fort.fertig summary .bs-chip { border-color: var(--success); color: var(--success); }
    .bs-fort.spaet summary .bs-chip { border-color: var(--warning); color: var(--warning); }
    .bs-schritte { list-style: none; display: flex; flex-direction: column; gap: 0.15rem; margin: 0.3rem 0 0.1rem 0.2rem; font-size: 0.82rem; color: var(--muted); }
    .bs-schritte li::before { content: "○ "; }
    .bs-schritte li.erreicht { color: var(--text); }
    .bs-schritte li.erreicht::before { content: "● "; color: var(--success); }
    .bs-hinweis-spaet { color: var(--warning); font-size: 0.84rem; line-height: 1.4; }
    .bs-summe { font-size: 0.86rem; color: var(--muted); }
    /* KS4-1: Liste "Eingetragen" oben, einklappbar */
    .bs-eingetragen > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1rem 0.7rem; min-height: 44px; }
    .bs-eingetragen > summary::-webkit-details-marker { display: none; }
    .bs-eingetragen > summary h2 { margin-bottom: 0; }
    .bs-eingetragen > summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
    .bs-eingetragen:not([open]) > summary::after { content: "▸"; }
    .bs-eingetragen[open] > summary { margin-bottom: 0.55rem; }
    .bs-eintrag.neu { border-color: var(--info); box-shadow: 0 0 0 1px var(--info); }
    .bs-termin-wahl { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: flex-end; }
    .bs-termin-wahl select { min-height: 44px; padding: 0.45rem 0.65rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; min-width: 0; max-width: 100%; }
    .bs-fehler { background: var(--danger-bg); border: 1px solid var(--danger); border-radius: 8px; padding: 0.8rem; line-height: 1.5; color: var(--text); }
    .bs-ok { border: 1px solid var(--success); background: var(--success-bg); border-radius: 8px; padding: 0.6rem 0.75rem; }
    .bs-laden { color: var(--muted); padding: 2rem 0; text-align: center; }
    .bs-gross { position: fixed; inset: 0; z-index: 30; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .bs-gross img { max-width: 100%; max-height: 90vh; border-radius: 8px; background: var(--surface); }
    /* KS7: Entwuerfe */
    .bs-ew-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0.5rem; }
    .bs-ew { display: flex; flex-direction: column; gap: 0.25rem; padding: 0; border: none; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; min-width: 0; }
    .bs-ew-rahmen { display: block; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
    .bs-ew-bild { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bs-ew-bild:not([src]) { visibility: hidden; }
    .bs-ew-titel { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; line-height: 1.3; }
    .bs-ew-gross { position: fixed; inset: 0; z-index: 31; background: var(--overlay); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem; touch-action: pan-y; }
    .bs-ew-gross img { max-width: 100%; max-height: 78vh; border-radius: 8px; background: var(--surface); object-fit: contain; }
    .bs-ew-gross .bs-ew-unten { display: flex; align-items: center; gap: 0.5rem; width: 100%; max-width: 640px; }
    .bs-ew-gross .bs-ew-unten span { flex: 1 1 auto; text-align: center; color: var(--text); background: var(--surface); border-radius: 8px; padding: 0.4rem 0.6rem; overflow-wrap: anywhere; }
    .bs-ew-gross button { min-width: 44px; min-height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 1.1rem; cursor: pointer; }
    .bs-ew-zu { position: absolute; top: 0.6rem; right: 0.6rem; }
    footer { max-width: 860px; margin: 0 auto; padding: 0.5rem 1rem 2rem; }
    [hidden] { display: none !important; }
  </style>

<body>
  <header>
    <span class="logo">JammiFashion · Bestellseite</span>
    <div class="theme-schalter" id="theme-schalter" role="group" aria-label="Farbdarstellung">
      <button type="button" data-theme-knopf="system" aria-pressed="true" aria-label="Farbdarstellung wie das Gerät">Auto</button>
      <button type="button" data-theme-knopf="light" aria-pressed="false" aria-label="Hell">☀</button>

  <main id="bs-main">
    <p class="bs-laden" id="bs-laden">Bestellseite wird geladen …</p>
  </main>
  <div id="bs-gross" class="bs-gross" hidden role="dialog" aria-label="Bild groß"><img alt="" referrerpolicy="no-referrer"></div>

  </div>

  <footer>
    <p class="bs-klein" id="bs-datenschutz">Bitte nur Kürzel oder Vorname eintragen. Rückennamen werden nur für den Druck genutzt und nach 12 Monaten gelöscht. Keine Telefonnummern, Adressen oder Gesundheitsangaben in Freitexte.</p>
  </footer>

  <script>
    const API_BASE = 'https://mission-control-backend-181760755456.europe-west1.run.app';
    const main = document.getElementById('bs-main');

    // ── Bestellseite-Anzeige: Anfang (reine Logik, Test backend/tests/bestellseite-seite.test.js, bestell-eintraege-seite.test.js) ──
    const BS_STUFE = {
      lieferbar: { klasse: 'lieferbar', text: 'lieferbar' },
      null: { klasse: 'knapp', text: 'zurzeit nicht vorrätig' },
      auslauf_null: { klasse: 'knapp', text: 'läuft aus, zurzeit nicht vorrätig' },
      auslauf: { klasse: 'auslauf', text: 'läuft aus' },
      nicht_gefuehrt: { klasse: 'weg', text: 'nicht mehr lieferbar' },
    };
    const BS_STATUS = { eingegangen: 'eingegangen', 'geprüft': 'geprüft', 'übernommen': 'übernommen', storniert: 'storniert' };
    const BS_MAX = { positionNotiz: 100, kuerzel: 12, notiz: 60, freitext: 200, fuer: 40, name: 30, wunsch: 200, positionen: 60, menge: 999 };
    const bsEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const bsDatum = ymd => (/^\d{4}-\d{2}-\d{2}$/.test(ymd || '') ? `${ymd.slice(8, 10)}.${ymd.slice(5, 7)}.${ymd.slice(0, 4)}` : '');
    const bsWochentag = ymd => (/^\d{4}-\d{2}-\d{2}$/.test(ymd || '') ? ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][new Date(`${ymd}T12:00:00Z`).getUTCDay()] : '');
    const bsUhr = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }); };
    function bsFehlerText(status, body) {
      if (status === 401) return 'Dieser Link ist nicht (mehr) gültig. Bitte den Link aus der Nachricht von JammiFashion öffnen.';
      if (status === 403) return body?.error || 'Diese Bestellseite ist nicht mehr freigegeben.';
      if (status === 429) return body?.error || 'Zu viele Versuche – bitte in 15 Minuten noch einmal.';
      if ([404, 409, 422].includes(status) && body?.error) return body.error;
      return 'Die Bestellseite ist gerade nicht erreichbar. Bitte später noch einmal versuchen.';
    }
    function bsGroesseHtml(g) {
      if (g.nochZuBesorgen) return `<span class="bs-gr">${bsEsc(g.groesse || 'eine Größe')} <span class="bs-besorgen">noch zu besorgen</span></span>`;
      const s = BS_STUFE[g.lieferbar] || null;
      return `<span class="bs-gr">${s ? `<span class="bs-punkt ${s.klasse}" role="img" aria-label="${bsEsc(s.text)}"></span>` : ''}${bsEsc(g.groesse || 'eine Größe')}</span>`;
    }
    /** Termin-Liste: Datum mit Wochentag, Notiz, Bestellschluss, Zahl der Eintraege; vergangene nur lesen. */
    function bsTermineHtml(d, gewaehlt) {
      const liste = d.termine || [];
      if (!liste.length) return `<p class="bs-klein">${d.termineAnlegen ? 'Noch kein Termin – unten „+ Termin“.' : 'Termin folgt.'}</p>`;
      return `<div class="bs-termine">${liste.map(x => `<button type="button" class="bs-termin${x.vergangen ? ' vorbei' : ''}" data-termin="${bsEsc(x.id)}" aria-pressed="${x.id === gewaehlt}">`
        + `<strong>${x.datum ? `${bsWochentag(x.datum)} ${bsDatum(x.datum)}` : 'Termin folgt'}</strong>${x.notiz ? `<span>${bsEsc(x.notiz)}</span>` : ''}`
        + `${x.vergangen ? '<span class="bs-klein">vorbei – nur lesen</span>' : x.bestellschluss ? `<span class="bs-schluss">Bestellschluss ${bsDatum(x.bestellschluss)}${x.nachSchluss ? ' – vorbei' : ` · am besten bis ${bsDatum(x.empfohlen)}`}</span>` : ''}`

    const bsIstAuftrag = d => d?.art === 'auftrag';

    function bsTexte(d) {

    /** Pruefung vor "In den Korb": mit Name/Nummer genau eine Groesse mit Anzahl 1. -> Fehlertext oder '' */
    function bsTextilFehler(artikel, werte, textil) {

      if (!name && !nummer) return '';

    /** Artikel nach Unterkategorie und Suche filtern (jedes Wort muss passen). */
    function bsArtikelFiltern(artikel, filter, suche) {

    /** Kompakte Zeile: kleines Bild (60 px, ohne Bild keine Flaeche), Name, Farbe, Groessen; offen = Mengen-Raster. */
    function bsArtikelZeileHtml(a, i, offen, schreibbar, textil = false) {

    }
    /** Raster -> Korb-Positionen (nur Mengen > 0, ganze Zahlen 1-999). */
    function bsPositionenAusRaster(artikel, werte, notiz = '', textil = null) {
      const pos = [];
      const nz = String(notiz || '').trim().slice(0, BS_MAX.positionNotiz);   // KS2-1: eine Notiz fuer alle Groessen dieser Karte
      const name = String(textil?.name || '').trim().slice(0, BS_MAX.name), nummer = String(textil?.nummer || '').trim();   // KS6

      for (const g of artikel.groessen || []) {
        const n = Number(werte[g.id] || 0);
        if (!Number.isInteger(n) || n <= 0) continue;
        pos.push({ art: 'artikel', id: g.id, menge: Math.min(n, BS_MAX.menge), text: `${artikel.name}${artikel.farbe ? ` · ${artikel.farbe}` : ''} · ${g.groesse || 'eine Größe'}${tx ? ` · Name/Nr.: ${tx}` : ''}`,
          besorgen: !!g.nochZuBesorgen, ...(nz ? { notiz: nz } : {}), ...(name ? { name } : {}), ...(nummer ? { nummer } : {}) });
      }
      return pos;
    }
    function bsKorbHtml(korb, kuerzel, schreibbar, texte = null) {
      if (!korb.length) return '';
      return `<section class="card bs-korb" aria-live="polite"><h2>Noch nicht abgesendet (${korb.length})</h2>`
        + korb.map((p, i) => `<div class="bs-pos"><span>${bsEsc(p.menge)} × ${bsEsc(p.text)}${p.besorgen ? ' <span class="bs-besorgen">noch zu besorgen</span>' : ''}${p.notiz ? ` <span class="bs-klein">· Notiz: ${bsEsc(p.notiz)}</span>` : ''}</span>`

    }
    function bsEintragWas(e) {
      if (e.art === 'extra') return `${e.menge} × ${e.freitext}${e.fuer ? ` (für ${e.fuer})` : ''}`;

    }
    /** KS4: Stand je Eintrag - nur der aktuelle Schritt (+ Datum), Tippen zeigt alle Schritte; Hinweis orange, wenn es nach dem Termin wird. */
    function bsFortschrittHtml(f) {

      const schritte = (f.schritte || []).length ? `<ol class="bs-schritte">${f.schritte.map(x => `<li${x.erreicht ? ' class="erreicht"' : ''}>${bsEsc(x.text)}</li>`).join('')}</ol>` : '';

    /** KS4: Termin-Datum zu einer Termin-ID (fuer "verschoben von/auf"). */
    const bsTerminDatum = (d, id) => { const x = (d?.termine || []).find(y => y.id === id); return x?.datum ? bsDatum(x.datum).slice(0, 6) : 'einem anderen Termin'; };
    /** Ein Eintrag der Liste: was, Kuerzel, Zeit, "nach Bestellschluss – ohne Garantie", Status; aendern/stornieren bis "übernommen". */
    // KS3: Status eingegangen · geprüft · übernommen · abgelehnt (+ Grund, MC); ab "übernommen" nur lesen.
    // KS4: Stand je Eintrag statt Status-Chip (wenn geliefert), "verschoben von …", Termin ändern bis "übernommen".
    function bsEintragHtml(e, schreibbar, d = null, terminWahl = '', neu = false) {
      const offen = schreibbar && !['übernommen', 'storniert'].includes(e.status);

        + `${status}${e.nachSchluss ? '<span class="bs-chip bs-spaet">nach Bestellschluss – ohne Garantie</span>' : ''}</div>`
        + (e.verschobenVon ? `<span class="bs-klein">verschoben von ${bsEsc(bsTerminDatum(d, e.verschobenVon))}${e.verschobenGrund ? ` – ${bsEsc(e.verschobenGrund)}` : ''}</span>` : '')
        + `${e.status === 'storniert' && e.ablehnGrund ? `<span class="bs-klein">abgelehnt: ${bsEsc(e.ablehnGrund)}</span>` : ''}`

          + `<button type="button" class="btn-ruhig" data-storno="${bsEsc(e.id)}">stornieren</button></div>` : '')

        + '</div>';

    /** KS4: von diesem Termin weg verschobene Eintraege - nur lesen. */
    function bsVerschobenHtml(liste) {

    /** KS2-2: Legende der Punkte - oben ueber der Artikelliste, eine Zeile, am Handy umbrechend (Texte wie freigegeben). */
    function bsLegendeHtml() {
      const s = Object.values(BS_STUFE).filter((x, i, l) => l.findIndex(y => y.klasse === x.klasse) === i)
        .map(x => `<span><span class="bs-punkt ${x.klasse}"></span>${bsEsc(x.text)}</span>`).join('');
      return `<div class="bs-legende" aria-label="Was bedeuten die Punkte?">${s}<span><span class="bs-besorgen">noch zu besorgen</span> = besorgen wir gesondert</span></div>`;

    /** KS2-2: Artikel ohne gewaehlten Termin (oder bei vorbei) nur ansehen - Hinweis, was zu tun ist. */
    function bsNurAnsehenText(d, termin) {

    }
    // ── Bestellseite-Anzeige: Ende ──

    const BS = { ew: null, ewUrls: new Map(), ewOffen: 0, d: null, termin: '', tab: 'artikel', filter: '', suche: '', offen: -1, korb: [], vorgang: '', eintraege: [], laedt: false, summe: null, verschoben: [], terminWahl: '', neu: null };
    const neuerVorgang = () => (crypto.randomUUID ? crypto.randomUUID() : `bs-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`);
    const sp = (() => { try { return window.sessionStorage; } catch { return null; } })();
    const kuerzelLesen = () => { try { return sp?.getItem('bs_kuerzel') || ''; } catch { return ''; } };

    const listeZuLesen = () => { try { return sp?.getItem('bs_liste_zu'); } catch { return null; } };
    const listeZuMerken = zu => { try { sp?.setItem('bs_liste_zu', zu ? '1' : '0'); } catch { /* gesperrt */ } };
    const listeOffen = () => { const z = listeZuLesen(); return z === null ? BS.eintraege.length > 0 || BS.laedt : z !== '1'; };
    const kuerzelMerken = k => { try { sp?.setItem('bs_kuerzel', k); } catch { /* gesperrt */ } };

    function themeKnoepfeZeigen() {

    themeKnoepfeZeigen();

    function fehlerZeigen(text) { main.innerHTML = `<div class="bs-fehler">${bsEsc(text)}</div>`; }
    /** Einzige Netzstelle der Seite: nur die eigene API, Token im Header (KS7: auch fuer die Entwurfs-Bilder). */
    const anfrage = (pfad, { body, cache = 'no-store' } = {}) => fetch(`${API_BASE}/api/bestellseite/${pfad}`, {
      method: body ? 'POST' : 'GET', referrerPolicy: 'no-referrer', cache,
      headers: { Authorization: `Bearer ${BS_TOKEN}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    async function api(pfad, body) {
      const res = await anfrage(pfad, { body });

` : d.abgeschlossen ? '' : `<p class="bs-banner" style="margin-bottom:0.7rem">${bsEsc(bsNurAnsehenText(d, t))}</p>`}

    // ── KS7: Entwuerfe laden (einmal je Seitenaufruf), Bilder als Bytes mit dem Token im Header -> blob-URL ──
    async function apiBild(pfad) {
      const res = await anfrage(pfad, { cache: 'default' });
      if (!res.ok) throw new Error(String(res.status));
      return URL.createObjectURL(await res.blob());
    }
    async function ewUrl(nr, groesse) {
      const k = `${nr}|${groesse}`;
      if (!BS.ewUrls.has(k)) BS.ewUrls.set(k, apiBild(`entwurf/${nr}?groesse=${groesse}`).catch(() => { BS.ewUrls.delete(k); return ''; }));
      const u = await BS.ewUrls.get(k);
      if (u) BS.ewUrls.set(k, u);
      return u;
    }
    let ewBeobachter = null;
    function ewBeobachten() {
      const bilder = [...document.querySelectorAll('.bs-ew-bild:not([src])')];
      if (!bilder.length) return;
      const laden = async img => { const u = await ewUrl(Number(img.dataset.ewNr), 'klein'); if (u && img.isConnected) img.src = u; };
      if (!('IntersectionObserver' in window)) { bilder.forEach(laden); return; }
      ewBeobachter?.disconnect();
      ewBeobachter = new IntersectionObserver(ev => ev.forEach(x => { if (x.isIntersecting) { ewBeobachter.unobserve(x.target); laden(x.target); } }), { rootMargin: '200px' });
      bilder.forEach(b => ewBeobachter.observe(b));
    }
    async function ewLaden() {
      if (!BS.d?.entwuerfe || BS.ew) return;

      zeichnen();
    }
    const ewEl = id => document.getElementById(id);
    async function ewZeigen(nr) {
      const e = (BS.ew?.liste || []).find(x => x.nr === nr); if (!e) return;
      BS.ewOffen = nr;

      const img = ewEl('bs-ew-bild');
      img.src = BS.ewUrls.get(`${nr}|klein`) && typeof BS.ewUrls.get(`${nr}|klein`) === 'string' ? BS.ewUrls.get(`${nr}|klein`) : '';
      ewEl('bs-ew-gross').hidden = false;
      const u = await ewUrl(nr, 'gross');
      if (u && BS.ewOffen === nr) img.src = u;
    }
    const ewSchliessen = () => { ewEl('bs-ew-gross').hidden = true; BS.ewOffen = 0; };
    const ewBlaettern = r => ewZeigen(bsEwSchritt(BS.ewOffen, r, BS.ew?.liste.length || 0));
    ewEl('bs-ew-zu').addEventListener('click', ewSchliessen);
    ewEl('bs-ew-vor').addEventListener('click', () => ewBlaettern(1));
    ewEl('bs-ew-zurueck').addEventListener('click', () => ewBlaettern(-1));
    ewEl('bs-ew-gross').addEventListener('click', e => { if (e.target.id === 'bs-ew-gross') ewSchliessen(); });
    let ewWischX = null;
    ewEl('bs-ew-gross').addEventListener('touchstart', e => { ewWischX = e.touches[0]?.clientX ?? null; }, { passive: true });
    ewEl('bs-ew-gross').addEventListener('touchend', e => {
      const x = e.changedTouches[0]?.clientX; if (ewWischX === null || x === undefined) return;
      const d = x - ewWischX; ewWischX = null;
      if (Math.abs(d) > 50) ewBlaettern(d < 0 ? 1 : -1);
    });
    document.addEventListener('keydown', e => {
      if (ewEl('bs-ew-gross').hidden) return;
      if (e.key === 'Escape') ewSchliessen(); else if (e.key === 'ArrowRight') ewBlaettern(1); else if (e.key === 'ArrowLeft') ewBlaettern(-1);
    });

    async function eintraegeLaden() {
      if (!BS.termin) { BS.eintraege = []; return; }
      BS.laedt = true; zeichnen();
      try { const r = await api(`eintraege?termin=${encodeURIComponent(BS.termin)}`); BS.eintraege = r.eintraege || []; BS.summe = r.summe || null; BS.verschoben = r.verschoben || []; }

    }
    function meldung(text, fehler = false) {

    }
    async function neuLaden(terminBehalten = true) {
      const alt = BS.termin;
      BS.d = await api('zugang');
      const t = BS.d.termine || [];
      BS.termin = terminBehalten && t.some(x => x.id === alt) ? alt
        : (t.find(x => !x.vergangen)?.id || (BS.d.art === 'auftrag' ? t[0]?.id : '') || '');

    }

    main.addEventListener('input', e => {
      if (e.target.id === 'bs-suche') { BS.suche = e.target.value; BS.offen = -1; const pos = e.target.selectionStart; zeichnen(); const s = document.getElementById('bs-suche'); s?.focus(); s?.setSelectionRange(pos, pos); }

      if (b.dataset.artikel !== undefined) { const i = Number(b.dataset.artikel); BS.offen = BS.offen === i ? -1 : i; zeichnen(); document.querySelector(`[data-artikel="${i}"]`)?.scrollIntoView({ block: 'nearest' }); return; }

        const tf = bsTextilFehler(a, werte, textil);
        if (tf) { meldung(tf, true); return; }
        const pos = bsPositionenAusRaster(a, werte, document.querySelector('[data-raster-notiz]')?.value, textil);
        if (!pos.length) { meldung('Bitte bei mindestens einer Größe eine Anzahl eintragen.', true); return; }
        BS.korb.push(...pos); if (!BS.vorgang) BS.vorgang = neuerVorgang(); BS.offen = -1; zeichnen(); return;
      }
      if (b.id === 'bs-abschliessen') {   // KS6
        if (BS.korb.length) { meldung('Erst die Positionen unten absenden (oder entfernen) – dann abschließen.', true); return; }
        if (!confirm('Bestellung abschließen?\nDanach kann niemand mehr eintragen oder ändern.')) return;
        b.disabled = true;
        try { await api('abschliessen', {}); await neuLaden(); meldung('Danke – die Bestellung ist abgeschlossen. Wir melden uns.'); }
        catch (err) { meldung(err.message, true); b.disabled = false; }
        return;
      }
      if (b.id === 'bs-x-neu') {
        const text = document.getElementById('bs-x-text').value.trim(), menge = Number(document.getElementById('bs-x-menge').value), fuer = document.getElementById('bs-x-fuer').value.trim();
        if (!text || !Number.isInteger(menge) || menge < 1) { meldung('Bitte Text und Anzahl eintragen.', true); return; }
        const xn = document.getElementById('bs-x-notiz').value.trim();
        BS.korb.push({ art: 'extra', freitext: text, menge, fuer, ...(xn ? { notiz: xn } : {}), text: `${text}${fuer ? ` (für ${fuer})` : ''}` }); if (!BS.vorgang) BS.vorgang = neuerVorgang(); zeichnen(); return;
      }
      if (b.id === 'bs-tr-neu') {
        const sel = document.getElementById('bs-tr-produkt'); const name = document.getElementById('bs-tr-name').value.trim(); const nummer = document.getElementById('bs-tr-nummer').value.trim();
        if (nummer && !/^\d{1,3}$/.test(nummer)) { meldung('Nummer: nur Ziffern (höchstens 3).', true); return; }
        const groesse = document.getElementById('bs-tr-groesse').value;
        const tn = document.getElementById('bs-tr-notiz').value.trim();
        BS.korb.push({ art: 'trikot', produktId: sel.value, groesse, name, nummer, wunsch: document.getElementById('bs-tr-wunsch').value.trim(), menge: 1, ...(tn ? { notiz: tn } : {}),
          text: `Trikot ${sel.selectedOptions[0]?.textContent || ''} · ${groesse}${name ? ` · ${name}` : ''}${nummer ? ` · ${nummer}` : ''}` });
        if (!BS.vorgang) BS.vorgang = neuerVorgang(); zeichnen(); return;
      }
      if (b.dataset.korbWeg !== undefined) { BS.korb.splice(Number(b.dataset.korbWeg), 1); if (!BS.korb.length) BS.vorgang = ''; zeichnen(); return; }
      if (b.id === 'bs-absenden') {

          BS.korb = []; BS.vorgang = '';
          await neuLaden();
          // KS4-1: Liste oben aufklappen, neue Eintraege kurz hervorheben, dorthin springen
          BS.neu = new Set(BS.eintraege.map(x => x.id).filter(id => !vorher.has(id)));
          listeZuMerken(false); zeichnen();
          document.getElementById('bs-eingetragen')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTimeout(() => { BS.neu = null; document.querySelectorAll('.bs-eintrag.neu').forEach(x => x.classList.remove('neu')); }, 4000);
          meldung(`${r.anzahl} Position${r.anzahl === 1 ? '' : 'en'} eingetragen${r.nachSchluss ? ' – nach Bestellschluss, ohne Garantie' : ''}.`);

        b.disabled = true;
        try { const r = await api('termin', { datum, notiz }); BS.termin = r.termin; await neuLaden(); meldung(r.schon ? 'Den Termin gibt es schon – er ist jetzt gewählt.' : 'Termin angelegt.'); }
        catch (err) { meldung(err.message, true); b.disabled = false; }
        return;
      }
      if (b.dataset.terminAendern) { BS.terminWahl = BS.terminWahl === b.dataset.terminAendern ? '' : b.dataset.terminAendern; zeichnen(); return; }   // KS4
      if (b.dataset.terminOk) {
        const en = BS.eintraege.find(x => x.id === b.dataset.terminOk); const kuerzel = kuerzelLesen();
        if (!kuerzel) { meldung(bsTexte(BS.d).kuerzelFehlt, true); return; }
        const ziel = document.querySelector(`[data-termin-ziel="${CSS.escape(b.dataset.terminOk)}"]`)?.value;
        if (!en || !ziel) return;
        try { await api('aendern', { eintrag: en.id, stand: en.stand, kuerzel, termin: ziel }); BS.terminWahl = ''; await neuLaden(); meldung('In den anderen Termin verschoben.'); }
        catch (err) { meldung(err.message, true); if (err.status === 409) await eintraegeLaden(); }
        return;
      }
      if (b.dataset.storno) {
        const en = BS.eintraege.find(x => x.id === b.dataset.storno); const kuerzel = kuerzelLesen();
        if (!kuerzel) { meldung(bsTexte(BS.d).kuerzelFehlt, true); return; }
        if (!en || !confirm(`Stornieren?\n${bsEintragWas(en)}`)) return;
        try { await api('stornieren', { eintrag: en.id, stand: en.stand, kuerzel }); await neuLaden(); meldung('Storniert.'); }
        catch (err) { meldung(err.message, true); if (err.status === 409) await eintraegeLaden(); }
        return;
      }
      if (b.dataset.aendern) {
        const en = BS.eintraege.find(x => x.id === b.dataset.aendern); const kuerzel = kuerzelLesen();
        if (!kuerzel) { meldung(bsTexte(BS.d).kuerzelFehlt, true); return; }
        if (!en) return;
        const feld = (frage, wert) => { const v = prompt(frage, wert ?? ''); return v === null ? undefined : v; };
        const body = { eintrag: en.id, stand: en.stand, kuerzel };
        if (en.art === 'artikel') {
          const karte = BS.d.artikel.find(a => (a.groessen || []).some(g => g.id === en.auswahl));
          const groessen = (karte?.groessen || []).map(g => g.groesse).filter(Boolean);
          if (groessen.length > 1) { const gr = feld(`Größe (${groessen.join(', ')}):`, en.groesse); if (gr === undefined) return; const g = karte.groessen.find(x => x.groesse.toLowerCase() === gr.trim().toLowerCase()); if (!g) { meldung('Diese Größe gibt es für den Artikel nicht.', true); return; } if (g.id !== en.auswahl) body.id = g.id; }
          const m = feld('Anzahl:', en.menge); if (m === undefined) return; body.menge = m;
          if (BS.d.personalisierung || bsTextilText(en)) {   // KS6: Name/Nummer auf dem Textil (leer = ohne)

          const x = feld('Was wird gebraucht?', en.freitext); if (x === undefined) return; body.freitext = x;

          const f = feld('Für wen? (Kürzel/Funktion)', en.fuer); if (f === undefined) return; body.fuer = f;
        } else {
          const tr = BS.d.trikots.find(x => x.produktId === en.trikotProdukt);
          const g = feld(`Größe (${(tr?.groessen || []).join(', ')}):`, en.groesse); if (g === undefined) return; body.groesse = g;

          const nr = feld('Nummer:', en.trikotNummer); if (nr === undefined) return; body.nummer = nr;
          const w = feld('Wunsch:', en.wunsch); if (w === undefined) return; body.wunsch = w;
        }
        const nz = feld('Notiz (nur Kürzel/Vorname):', en.notiz); if (nz === undefined) return; body.notiz = nz;   // KS2-1
        try { await api('aendern', body); await neuLaden(); meldung('Geändert.'); }
        catch (err) { meldung(err.message, true); if (err.status === 409) await eintraegeLaden(); }
      }
    });
    document.getElementById('bs-gross').addEventListener('click', e => { e.currentTarget.hidden = true; });
    main.addEventListener('toggle', e => { if (e.target.id === 'bs-eingetragen') listeZuMerken(!e.target.open); }, true);   // KS4-1

    async function laden() {
      if (!BS_TOKEN) { fehlerZeigen(bsFehlerText(401)); return; }
      try { await neuLaden(false); }
      catch (e) {
        if (e.status === 401) { try { sessionStorage.removeItem('bs_token'); } catch { /* gesperrt */ } }
        fehlerZeigen(e.status ? e.message : bsFehlerText(0));
      }
    }
    laden();
